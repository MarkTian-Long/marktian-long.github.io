name: One-time staged Personal Agent publication

on:
  push:
    branches:
      - stage-personal-agent-20261018

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install verification dependencies
        working-directory: scripts
        run: npm ci
      - name: Install Chromium for browser checks
        working-directory: scripts
        run: npx playwright install --with-deps chromium
      - name: Generate and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          node tools/blog/sync-post-metadata.js --write docs/blog/personal-agent.md --date 2026.10
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const doc = fs.readFileSync('docs/blog/personal-agent.md', 'utf8');
          const figures = [...doc.matchAll(/^!\[([^\]\r\n]+)\]\(\.\.\/\.\.\/(assets\/images\/blog\/personal-agent\/[a-z0-9-]+\.svg) "([^"\r\n]+)"\)$/gm)].map(m => ({ src:m[2], alt:m[1], caption:m[3], width:1280, height:720 }));
          if (figures.length !== 2) throw new Error('Expected exactly two registered SVG diagrams in final Markdown');
          const metadataPath = 'tools/blog/data/posts-meta.json';
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          const post = metadata.posts.find(p => p.slug === 'personal-agent');
          if (!post) throw new Error('Missing Personal Agent metadata after sync');
          post.visuals = { inline: figures };
          fs.writeFileSync(metadataPath, JSON.stringify(metadata, null, 2) + '\n');
          const sourceSha = cp.execFileSync('git', ['hash-object', 'docs/blog/personal-agent.md'], {encoding:'utf8'}).trim();
          for (const file of ['continuing-delegation','product-scenario-guide']) {
            const path = 'assets/images/blog/personal-agent/' + file + '.svg';
            let svg = fs.readFileSync(path, 'utf8');
            svg = svg.replace(/(&quot;source_markdown&quot;:&quot;)[^&]+(&quot;)/,'$1docs/blog/personal-agent.md$2')
                     .replace(/(&quot;source_blob_sha&quot;:&quot;)[a-f0-9]+(&quot;)/,'$1'+sourceSha+'$2');
            if (!svg.includes('docs/blog/personal-agent.md') || !svg.includes(sourceSha)) throw new Error('SVG provenance update failed for '+path);
            fs.writeFileSync(path, svg, 'utf8');
          }
          NODE
          node tools/blog/generate-post.js --write docs/blog/personal-agent.md tools/blog/posts/personal-agent.html
          node scripts/generate-search-assets.js --write
          git rm -- .github/workflows/stage-personal-agent-20261018.yml
          git add -u
          git add tools/blog/posts/personal-agent.html
          (cd scripts && npm run check)
          node scripts/build-public-dist.js
          node scripts/check-public-dist.js
          git add -u
          git add tools/blog/posts/personal-agent.html
          git diff --cached --check
          git -c user.name='Blog Release Automation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'publish(blog): generate Personal Agent page, metadata and search assets'
          git push origin HEAD:stage-personal-agent-20261018
