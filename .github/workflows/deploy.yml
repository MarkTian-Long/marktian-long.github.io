name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification dependencies
        working-directory: scripts
        run: npm ci

      # Temporary one-article build. Restore original workflow after publishing.
      - name: Generate updated SaaS article assets
        run: |
          node tools/blog/generate-post.js --write docs/blog/ai-saas-build-vs-buy.md tools/blog/posts/ai-saas-build-vs-buy.html
          node scripts/generate-search-assets.js --write
          git add -A

      - name: Install Chromium for browser checks
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Verify site
        working-directory: scripts
        run: npm run check

      - name: Build public artifact
        run: node scripts/build-public-dist.js

      - name: Smoke public artifact
        run: node scripts/check-public-dist.js

      - name: Commit verified generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate SaaS article with new editorial illustrations"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
