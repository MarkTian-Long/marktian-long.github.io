<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">持续回环的价值工作流</title>
  <desc id="desc">任务进入，澄清问题，定义价值，实现验证与交付，沉淀修正与连接构成循环。新证据或发现问题界定偏差可返回澄清问题；循环不保证自动提升。</desc>
  <!-- Editorial source for docs/blog/ai-work-value-loop.md. Editable vector asset; embedded as an SVG image, not a rasterized derivative. Warm paper, navy text, clay main arrows; blue-gray dashed arrows denote feedback. Labels are intentionally larger than the standard baseline for mobile reading. -->
  <defs>
    <marker id="forward" viewBox="0 0 12 10" markerWidth="24" markerHeight="20" refX="10" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#b95e3f"/></marker>
    <marker id="feedback" viewBox="0 0 12 10" markerWidth="24" markerHeight="20" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 5L0 10Z" fill="#657c91"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17283c} .box{fill:#ffffff;stroke:#d5d9df;stroke-width:2} .main{fill:none;stroke:#b95e3f;stroke-width:5;marker-end:url(#forward);stroke-linecap:round} .back{fill:none;stroke:#657c91;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#feedback)} .label{font-size:48px;font-weight:700;text-anchor:middle} .note{font-size:34px;fill:#4f6478;text-anchor:middle}</style>
  </defs>
