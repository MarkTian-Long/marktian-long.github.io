<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">用标题改色任务理解四阶段行动分析</title>
  <desc id="desc">以全文一级标题改成蓝色为例：形成意图，确定修改标题样式的方法，实际改色并应用，检查标题及误改。需要修正时可能再次形成行动；状态变化也可能先触发观察与评估。这是连续活动的分析示意，例子为本文构造，不表示四个独立界面或固定操作步骤。</desc>
  <defs>
    <marker id="action-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#c96442" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="state-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#507fa1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#faf9f5"/>
  <g font-family="Arial,'Noto Sans CJK SC',sans-serif">
    <text x="64" y="90" font-size="56" font-weight="700" fill="#18263d">同一任务，分析上可分四阶段</text>
    <g fill="#fff" stroke="#d8deda" stroke-width="2">
      <rect x="96" y="150" width="462" height="188" rx="18"/>
      <rect x="722" y="150" width="462" height="188" rx="18"/>
      <rect x="722" y="436" width="462" height="188" rx="18"/>
      <rect x="96" y="436" width="462" height="188" rx="18"/>
    </g>
    <g fill="#18263d" font-size="60" font-weight="700">
      <text x="132" y="222">意图</text>
      <text x="758" y="222">选择</text>
      <text x="758" y="508">执行</text>
      <text x="132" y="508">评估</text>
    </g>
    <g fill="#5e5d59" font-size="48">
      <text x="132" y="292">一级标题改蓝色</text>
      <text x="758" y="292">确定修改标题样式</text>
      <text x="758" y="578">实际改色并应用</text>
      <text x="132" y="578">检查标题与误改</text>
    </g>
    <g fill="none" stroke="#c96442" stroke-width="5" marker-end="url(#action-arrow)">
      <path d="M578 244 H700"/>
      <path d="M953 358 V414"/>
      <path d="M702 530 H580"/>
      <path d="M327 416 V360" stroke-dasharray="10 8"/>
    </g>
    <text x="358" y="402" font-size="40" fill="#9b5136">需要修正时</text>
    <path d="M327 689 V646" fill="none" stroke="#507fa1" stroke-width="5" marker-end="url(#state-arrow)"/>
    <text x="96" y="690" font-size="44" fill="#507fa1">状态变化</text>
    <text x="385" y="690" font-size="40" fill="#5e5d59">也可能先观察，再形成目标</text>
  </g>
</svg>