<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
<title id="title">从技术表现到经营结果的衡量地图</title>
<desc id="desc">业务结果指标、流程机制指标和 Agent 诊断指标承担不同职责。基线、对照、分母和观察窗用于归因，授权、安全、质量和合规是横跨各层的护栏。</desc>
<rect width="1280" height="1024" fill="#f7f4ee"/>
<text x="64" y="82" fill="#14243a" font-size="52" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">指标有不同职责，不能互相替代</text>
<text x="64" y="130" fill="#536273" font-size="32" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">从企业结果追问机制，再用技术诊断解释局部表现</text>
<g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="64" y="180" width="1152" height="180" rx="24" fill="#fffdf9" stroke="#d97757" stroke-width="3"/>
  <rect x="64" y="180" width="20" height="180" rx="10" fill="#d97757"/>
  <text x="112" y="240" fill="#9a4f37" font-size="44" font-weight="700">业务结果指标</text>
  <text x="112" y="296" fill="#14243a" font-size="38">成本 · 合格吞吐 · 收入 · 客户结果 · 风险</text>
  <text x="112" y="340" fill="#536273" font-size="32">回答：企业最终获得了什么？</text>
  <rect x="64" y="390" width="1152" height="180" rx="24" fill="#fffdf9" stroke="#4f82b8" stroke-width="3"/>
  <rect x="64" y="390" width="20" height="180" rx="10" fill="#4f82b8"/>
  <text x="112" y="450" fill="#37658f" font-size="44" font-weight="700">流程机制指标</text>
  <text x="112" y="506" fill="#14243a" font-size="38">覆盖 · 分流 · 周期 · 交接 · 接管 · 返工 · 重开</text>
  <text x="112" y="550" fill="#536273" font-size="32">回答：变化通过什么机制发生？</text>
  <rect x="64" y="600" width="1152" height="180" rx="24" fill="#fffdf9" stroke="#7a6ca8" stroke-width="3"/>
  <rect x="64" y="600" width="20" height="180" rx="10" fill="#7a6ca8"/>
  <text x="112" y="660" fill="#695a95" font-size="44" font-weight="700">Agent 诊断指标</text>
  <text x="112" y="716" fill="#14243a" font-size="38">最终状态 · 完整验收 · pass^k · 延迟 · 调用成本</text>
  <text x="112" y="760" fill="#536273" font-size="32">回答：系统在限定任务中表现如何？</text>
  <path d="M640 365 V382 M628 373 L640 386 L652 373 M640 575 V592 M628 583 L640 596 L652 583" stroke="#8b95a2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="64" y="815" width="1152" height="76" rx="16" fill="#e9eef3"/>
<text x="96" y="865" fill="#294663" font-size="36" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">归因条件：基线 · 对照 · 分母 · 观察窗</text>
<rect x="64" y="910" width="1152" height="76" rx="16" fill="#f3e8e2"/>
<text x="96" y="960" fill="#9a4f37" font-size="36" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">硬护栏：授权 · 安全 · 质量 · 合规</text>
</svg>