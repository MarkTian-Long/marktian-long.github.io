<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
<title id="title">从技术表现到经营结果的衡量地图</title>
<desc id="desc">业务结果指标、流程机制指标和 Agent 诊断指标承担不同职责。基线、对照、分母和观察窗用于归因，授权、安全、质量和合规是横跨各层的护栏。</desc>
<rect width="1280" height="1024" fill="#f7f4ee"/>
<text x="64" y="82" fill="#14243a" font-size="60" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">指标有不同职责，不能互相替代</text>
<text x="64" y="140" fill="#536273" font-size="48" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">从企业结果追问机制，再用技术诊断解释局部表现</text>
<g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="64" y="180" width="1152" height="185" rx="24" fill="#fffdf9" stroke="#d97757" stroke-width="3"/>
  <rect x="64" y="180" width="20" height="185" rx="10" fill="#d97757"/>
  <text x="112" y="245" fill="#9a4f37" font-size="58" font-weight="700">业务结果指标</text>
  <text x="112" y="310" fill="#14243a" font-size="52">成本 · 合格吞吐 · 收入</text>
  <text x="112" y="355" fill="#14243a" font-size="52">客户结果 · 风险</text>

  <rect x="64" y="395" width="1152" height="185" rx="24" fill="#fffdf9" stroke="#4f82b8" stroke-width="3"/>
  <rect x="64" y="395" width="20" height="185" rx="10" fill="#4f82b8"/>
  <text x="112" y="460" fill="#37658f" font-size="58" font-weight="700">流程机制指标</text>
  <text x="112" y="525" fill="#14243a" font-size="52">覆盖 · 分流 · 周期 · 交接</text>
  <text x="112" y="570" fill="#14243a" font-size="52">接管 · 返工 · 重开</text>

  <rect x="64" y="610" width="1152" height="185" rx="24" fill="#fffdf9" stroke="#7a6ca8" stroke-width="3"/>
  <rect x="64" y="610" width="20" height="185" rx="10" fill="#7a6ca8"/>
  <text x="112" y="675" fill="#695a95" font-size="58" font-weight="700">Agent 诊断指标</text>
  <text x="112" y="740" fill="#14243a" font-size="52">最终状态 · 完整验收 · 可靠性</text>
  <text x="112" y="785" fill="#14243a" font-size="52">延迟 · 工具错误 · 调用成本</text>
  <path d="M640 370 V388 M626 378 L640 394 L654 378 M640 585 V603 M626 593 L640 609 L654 593" stroke="#8b95a2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="64" y="825" width="1152" height="76" rx="16" fill="#e9eef3"/>
<text x="94" y="879" fill="#294663" font-size="52" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">归因条件：基线 · 对照 · 分母 · 观察窗</text>
<rect x="64" y="915" width="1152" height="76" rx="16" fill="#f3e8e2"/>
<text x="94" y="969" fill="#9a4f37" font-size="52" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">硬护栏：授权 · 安全 · 质量 · 合规</text>
</svg>