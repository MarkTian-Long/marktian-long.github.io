<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
<title id="title">Agent 进入前后的典型业务流程</title>
<desc id="desc">上方是人工主导的请求、分流、判断与跟进。下方是 Agent 在授权范围内处理，随后判断是否已授权且风险可接受；常规任务交由工具执行，例外任务转人工判断或暂停，两条路径最终汇入结果核验与交付。</desc>
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
    <path d="M0 0 L14 7 L0 14 Z" fill="#8b95a2"/>
  </marker>
</defs>
<rect width="1280" height="1024" fill="#f7f4ee"/>
<text x="64" y="82" fill="#14243a" font-size="60" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">比较完整工作方式，而不是 Agent 单独一段</text>
<text x="64" y="140" fill="#536273" font-size="48" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">通用示意流程；实际节点与责任按业务场景还原</text>
<g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <text x="64" y="202" fill="#536273" font-size="58" font-weight="700">引入前：人工主导</text>
  <rect x="64" y="235" width="260" height="120" rx="20" fill="#fffdf9" stroke="#cfd5dc" stroke-width="2"/>
  <text x="194" y="310" text-anchor="middle" fill="#14243a" font-size="52" font-weight="700">请求进入</text>
  <rect x="354" y="235" width="260" height="120" rx="20" fill="#fffdf9" stroke="#cfd5dc" stroke-width="2"/>
  <text x="484" y="310" text-anchor="middle" fill="#14243a" font-size="52" font-weight="700">人工分流</text>
  <rect x="644" y="235" width="260" height="120" rx="20" fill="#fffdf9" stroke="#cfd5dc" stroke-width="2"/>
  <text x="774" y="310" text-anchor="middle" fill="#14243a" font-size="52" font-weight="700">判断与操作</text>
  <rect x="934" y="235" width="282" height="120" rx="20" fill="#fffdf9" stroke="#cfd5dc" stroke-width="2"/>
  <text x="1075" y="310" text-anchor="middle" fill="#14243a" font-size="52" font-weight="700">复核与跟进</text>
  <g stroke="#8b95a2" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M324 295 H342"/>
    <path d="M614 295 H632"/>
    <path d="M904 295 H922"/>
  </g>

  <text x="64" y="450" fill="#37658f" font-size="58" font-weight="700">引入后：Agent 与人协作</text>
  <rect x="64" y="560" width="250" height="128" rx="20" fill="#fffdf9" stroke="#b7cce0" stroke-width="2"/>
  <text x="189" y="638" text-anchor="middle" fill="#14243a" font-size="56" font-weight="700">请求进入</text>
  <rect x="350" y="560" width="300" height="128" rx="20" fill="#e9f0f7" stroke="#8eb1d1" stroke-width="2"/>
  <text x="500" y="638" text-anchor="middle" fill="#294663" font-size="60" font-weight="700">Agent 处理</text>
  <path d="M318 624 H338" stroke="#8b95a2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M654 624 H732" stroke="#8b95a2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <polygon points="880,500 1030,625 880,750 730,625" fill="#fff4e7" stroke="#dfb36f" stroke-width="4"/>
  <text x="880" y="610" text-anchor="middle" fill="#875d23" font-size="52" font-weight="700">在授权范围？</text>
  <text x="880" y="672" text-anchor="middle" fill="#875d23" font-size="52" font-weight="700">风险可接受？</text>

  <rect x="1050" y="470" width="210" height="120" rx="20" fill="#edf2ed" stroke="#b9c8b9" stroke-width="2"/>
  <text x="1155" y="545" text-anchor="middle" fill="#294d38" font-size="52" font-weight="700">工具执行</text>
  <rect x="1050" y="690" width="210" height="120" rx="20" fill="#f4e8e3" stroke="#d6b4a7" stroke-width="2"/>
  <text x="1155" y="740" text-anchor="middle" fill="#8e4e38" font-size="52" font-weight="700">人工判断</text>
  <text x="1155" y="790" text-anchor="middle" fill="#6e5b55" font-size="52">或暂停</text>

  <path d="M1000 550 C1020 540 1030 530 1042 530" stroke="#8b95a2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <text x="1014" y="500" fill="#536273" font-size="52">是</text>
  <path d="M1000 700 C1020 720 1030 745 1042 745" stroke="#8b95a2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <text x="1014" y="718" fill="#536273" font-size="52">否</text>

  <rect x="650" y="860" width="610" height="90" rx="20" fill="#e9eef3" stroke="#c8d3dd" stroke-width="2"/>
  <text x="955" y="922" text-anchor="middle" fill="#294663" font-size="56" font-weight="700">状态核验与交付</text>
  <path d="M1260 530 H1270 V905 H1262" stroke="#8b95a2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1155 810 V842" stroke="#8b95a2" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
</g>
</svg>