<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
<title id="title">Agent 业务价值的四步衡量框架</title>
<desc id="desc">四个连续判断：明确价值目标与主体，识别工作系统变化，建立结果证据与归因，判断价值兑现和投入决策。技术诊断与硬护栏横跨各步。</desc>
<rect width="1280" height="1024" fill="#f7f4ee"/>
<text x="64" y="82" fill="#14243a" font-size="60" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">Agent 业务价值的四步衡量框架</text>
<text x="64" y="142" fill="#536273" font-size="48" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">从目标定义走到结果验证与持续投入</text>
<g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="64" y="180" width="1152" height="150" rx="24" fill="#fffdf9" stroke="#d9d5cc" stroke-width="2"/>
  <rect x="64" y="180" width="18" height="150" rx="9" fill="#d97757"/>
  <circle cx="136" cy="255" r="42" fill="#f3e4db"/>
  <text x="136" y="273" text-anchor="middle" fill="#9a4f37" font-size="52" font-weight="700">01</text>
  <text x="220" y="245" fill="#14243a" font-size="60" font-weight="700">价值目标与主体</text>
  <text x="220" y="303" fill="#536273" font-size="52">谁受益、谁付款、谁承担风险？</text>

  <rect x="64" y="355" width="1152" height="150" rx="24" fill="#fffdf9" stroke="#d9d5cc" stroke-width="2"/>
  <rect x="64" y="355" width="18" height="150" rx="9" fill="#4f82b8"/>
  <circle cx="136" cy="430" r="42" fill="#e4edf5"/>
  <text x="136" y="448" text-anchor="middle" fill="#37658f" font-size="52" font-weight="700">02</text>
  <text x="220" y="420" fill="#14243a" font-size="60" font-weight="700">工作系统变化</text>
  <text x="220" y="478" fill="#536273" font-size="52">任务、人机分工和交接怎样改变？</text>

  <rect x="64" y="530" width="1152" height="150" rx="24" fill="#fffdf9" stroke="#d9d5cc" stroke-width="2"/>
  <rect x="64" y="530" width="18" height="150" rx="9" fill="#7a6ca8"/>
  <circle cx="136" cy="605" r="42" fill="#ece8f4"/>
  <text x="136" y="623" text-anchor="middle" fill="#695a95" font-size="52" font-weight="700">03</text>
  <text x="220" y="595" fill="#14243a" font-size="60" font-weight="700">结果证据与归因</text>
  <text x="220" y="653" fill="#536273" font-size="52">相对基线，结果是否改善？</text>

  <rect x="64" y="705" width="1152" height="150" rx="24" fill="#fffdf9" stroke="#d9d5cc" stroke-width="2"/>
  <rect x="64" y="705" width="18" height="150" rx="9" fill="#d59b43"/>
  <circle cx="136" cy="780" r="42" fill="#f6ecd9"/>
  <text x="136" y="798" text-anchor="middle" fill="#9b6c27" font-size="52" font-weight="700">04</text>
  <text x="220" y="770" fill="#14243a" font-size="60" font-weight="700">价值兑现与投入决策</text>
  <text x="220" y="828" fill="#536273" font-size="52">收益是否实现，扩围是否仍值得？</text>
  <path d="M640 332 V348 M626 338 L640 354 L654 338 M640 507 V523 M626 513 L640 529 L654 513 M640 682 V698 M626 688 L640 704 L654 688" stroke="#8b95a2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="64" y="885" width="1152" height="58" rx="16" fill="#e9eef3"/>
<text x="94" y="927" fill="#294663" font-size="50" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">技术诊断：正确性 · 可靠性 · 延迟 · 成本</text>
<rect x="64" y="954" width="1152" height="58" rx="16" fill="#f3e8e2"/>
<text x="94" y="996" fill="#9a4f37" font-size="50" font-weight="700" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">硬护栏：授权 · 安全 · 质量 · 合规</text>
</svg>