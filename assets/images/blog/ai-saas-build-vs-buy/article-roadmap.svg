<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">文章递进路线</title><desc id="desc">五个问题依次展开：能否替代、采购原因、相对经济性、议价变化、能力分工。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c96442" stroke-width="1.7"/></marker></defs><rect width="1280" height="720" fill="#faf9f5"/><g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="76" font-size="50" fill="#080c18" font-weight="700">从软件复刻，到买与建的选择</text><text x="48" y="124" font-size="30" fill="#596270" font-weight="400">先判断能否替代，再比较谁更合算</text><rect x="48" y="184" width="364" height="196" rx="18" fill="#fff" stroke="#ddd9d1" stroke-width="2"/><text x="72" y="221" font-size="26" fill="#c96442" font-weight="700">01</text><text x="72" y="287" font-size="56" fill="#080c18" font-weight="700">能替代吗</text><text x="72" y="337" font-size="30" fill="#596270" font-weight="400">功能、验收与承接</text><rect x="458" y="184" width="364" height="196" rx="18" fill="#fff" stroke="#ddd9d1" stroke-width="2"/><text x="482" y="221" font-size="26" fill="#c96442" font-weight="700">02</text><text x="482" y="287" font-size="56" fill="#080c18" font-weight="700">为何要买</text><text x="482" y="337" font-size="30" fill="#596270" font-weight="400">共同复用与协调成本</text><rect x="868" y="184" width="364" height="196" rx="18" fill="#f7ebe4" stroke="#ddd9d1" stroke-width="2"/><text x="892" y="221" font-size="26" fill="#c96442" font-weight="700">03</text><text x="892" y="287" font-size="56" fill="#080c18" font-weight="700">谁更划算</text><text x="892" y="337" font-size="30" fill="#596270" font-weight="400">双方用 AI 后再比较</text><rect x="868" y="444" width="364" height="196" rx="18" fill="#fff" stroke="#ddd9d1" stroke-width="2"/><text x="892" y="481" font-size="26" fill="#c96442" font-weight="700">04</text><text x="892" y="547" font-size="56" fill="#080c18" font-weight="700">能否议价</text><text x="892" y="597" font-size="30" fill="#596270" font-weight="400">可信替代影响条件</text><rect x="458" y="444" width="364" height="196" rx="18" fill="#fff" stroke="#ddd9d1" stroke-width="2"/><text x="482" y="481" font-size="26" fill="#c96442" font-weight="700">05</text><text x="482" y="547" font-size="56" fill="#080c18" font-weight="700">怎样分工</text><text x="482" y="597" font-size="30" fill="#596270" font-weight="400">按可独立交付的能力</text><path d="M413 282 H448" fill="none" stroke="#c96442" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M823 282 H858" fill="none" stroke="#c96442" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1050 381 V432" fill="none" stroke="#c96442" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M858 542 H832" fill="none" stroke="#c96442" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="56" y="511" font-size="34" fill="#596270" font-weight="400">比较的不是</text><text x="56" y="557" font-size="44" fill="#c96442" font-weight="700">单次开发费</text><text x="56" y="605" font-size="34" fill="#596270" font-weight="400">而是持续交付</text></g></svg>