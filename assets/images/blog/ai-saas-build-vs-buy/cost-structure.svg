<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">AI 影响软件成本的不同环节</title><desc id="desc">编码与维护存在提效空间，运行费用取决于模型调用方式，协调与验收仍需核算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c96442" stroke-width="1.7"/></marker></defs><rect width="1280" height="720" fill="#faf9f5"/><g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="76" font-size="48" fill="#080c18" font-weight="700">AI 改变成本，但不保证每项都下降</text><text x="48" y="123" font-size="30" fill="#596270" font-weight="400">客户自建与供应商交付，都需要按同一口径核算</text><rect x="48" y="168" width="572" height="224" rx="18" fill="#eaf2ff" stroke="#ddd9d1" stroke-width="2"/><text x="76" y="226" font-size="50" fill="#080c18" font-weight="700">编码投入</text><text x="76" y="293" font-size="40" fill="#c96442" font-weight="600">可减少实现工作</text><text x="76" y="349" font-size="34" fill="#596270" font-weight="400">还需计入需求与验证</text><rect x="660" y="168" width="572" height="224" rx="18" fill="#fff" stroke="#ddd9d1" stroke-width="2"/><text x="688" y="226" font-size="50" fill="#080c18" font-weight="700">维护投入</text><text x="688" y="293" font-size="40" fill="#c96442" font-weight="600">可自动化部分任务</text><text x="688" y="349" font-size="34" fill="#596270" font-weight="400">仍要审查、回退与接手</text><rect x="48" y="426" width="572" height="224" rx="18" fill="#f7ebe4" stroke="#ddd9d1" stroke-width="2"/><text x="76" y="484" font-size="50" fill="#080c18" font-weight="700">运行费用</text><text x="76" y="551" font-size="40" fill="#c96442" font-weight="600">先看是否调用模型</text><text x="76" y="607" font-size="34" fill="#596270" font-weight="400">再核算用量与基础设施</text><rect x="660" y="426" width="572" height="224" rx="18" fill="#fff" stroke="#ddd9d1" stroke-width="2"/><text x="688" y="484" font-size="50" fill="#080c18" font-weight="700">组织成本</text><text x="688" y="551" font-size="40" fill="#c96442" font-weight="600">仍需协调与验收</text><text x="688" y="607" font-size="34" fill="#596270" font-weight="400">谁更省时，要具体比较</text><text x="48" y="693" font-size="28" fill="#596270" font-weight="400">机制示意，非成本比例；用 AI 开发 ≠ 运行时调用 AI。</text></g></svg>