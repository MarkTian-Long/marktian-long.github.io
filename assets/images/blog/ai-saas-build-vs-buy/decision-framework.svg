<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">自建、采购还是组合：横向判断框架</title><desc id="desc">先确定任务与验收标准，同时权衡需求特殊性、跨客户复用、变化与治理三个并列维度，再检查内部承接能力、风险与退出成本，最终在自建、采购或组合三种安排中比较。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#c96442" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1280" height="720" fill="#faf9f5"/><text x="48" y="72" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="50" font-weight="700" fill="#080c18">买、建还是组合？</text><text x="1232" y="68" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="400" fill="#596270" text-anchor="end">先界定任务，再比较相对优势</text><path d="M48 94 H1232" fill="none" stroke="#dcdad5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="119" width="740" height="80" rx="18" fill="#eaf2ff" stroke="#abc8ef" stroke-width="2"/><text x="640" y="155" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="37" font-weight="700" fill="#080c18" text-anchor="middle">明确任务与验收标准</text><text x="640" y="184" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="400" fill="#596270" text-anchor="middle">完成什么任务？如何证明真正完成？</text><path d="M640 200 V226" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="48" y="258" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="700" fill="#c96442">三个并列判断维度</text><text x="1232" y="258" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="400" fill="#596270" text-anchor="end">同时考虑 · 不是先后关卡</text><rect x="48" y="278" width="363" height="170" rx="18" fill="#f7ebe4" stroke="#dcdad5" stroke-width="2"/><rect x="68" y="302" width="7" height="39" rx="3" fill="#c96442"/><text x="91" y="332" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#080c18">需求特殊性</text><text x="73" y="390" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#596270">独有流程越多</text><text x="73" y="430" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#c96442">自建 / 定制越值得比较</text><rect x="459" y="278" width="363" height="170" rx="18" fill="#eaf2ff" stroke="#dcdad5" stroke-width="2"/><rect x="479" y="302" width="7" height="39" rx="3" fill="#2563eb"/><text x="502" y="332" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#080c18">跨客户复用</text><text x="484" y="390" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#596270">共同能力越多</text><text x="484" y="430" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#2563eb">外购越可能划算</text><rect x="870" y="278" width="363" height="170" rx="18" fill="#f2f3f1" stroke="#dcdad5" stroke-width="2"/><rect x="890" y="302" width="7" height="39" rx="3" fill="#596270"/><text x="913" y="332" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" fill="#080c18">变化与治理</text><text x="895" y="390" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#596270">持续迭代、系统耦合</text><text x="895" y="430" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#596270">需核算协调与责任</text><path d="M229 449 V462" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 449 V462" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1051 449 V462" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M229 462 H1051" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 463 V487" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="155" y="493" width="970" height="81" rx="18" fill="#ffffff" stroke="#dcdad5" stroke-width="2"/><text x="640" y="528" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="#080c18" text-anchor="middle">再核验：内部承接能力、风险与退出成本</text><text x="640" y="559" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="400" fill="#596270" text-anchor="middle">同一任务、同一质量要求下比较长期投入</text><path d="M640 575 V589" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 591 H1040" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 592 V610" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 592 V610" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1040 592 V610" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="615" width="363" height="77" rx="16" fill="#f7ebe4" stroke="#dcdad5" stroke-width="2"/><text x="69" y="648" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#c96442">自建</text><text x="69" y="678" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#596270">内部持续承接</text><rect x="459" y="615" width="363" height="77" rx="16" fill="#eaf2ff" stroke="#dcdad5" stroke-width="2"/><text x="480" y="648" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#2563eb">采购</text><text x="480" y="678" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#596270">共享能力外部承接</text><rect x="870" y="615" width="363" height="77" rx="16" fill="#e9f4eb" stroke="#dcdad5" stroke-width="2"/><text x="891" y="648" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#287a52">组合</text><text x="891" y="678" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#596270">按可独立交付的模块分工</text></svg>