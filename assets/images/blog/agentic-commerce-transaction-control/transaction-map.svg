<text x="792" y="390" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">商家接受订单</text>
<rect x="362" y="319" width="252" height="103" rx="15" fill="#f0eee9" stroke="#d8dcd6" stroke-width="1.5"/>
<text x="381" y="349" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" fill="#ac6246" font-weight="700">07</text>
<text x="488" y="390" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">履约与售后</text>
<rect x="58" y="319" width="252" height="103" rx="15" fill="#f0eee9" stroke="#d8dcd6" stroke-width="1.5"/>
