<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="st sd">
<title id="st">一笔交易的完整链路与三种分析维度</title><desc id="sd">交易链按需求、发现、选择、委托授权、支付验证、商家接单、履约售后、复购八个环节排列。对每个环节均考察控制权、责任和经济价值。这是典型分析链，不是固定交易技术时序。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4f6588" stroke-width="1.7" stroke-linecap="round"/></marker></defs>
<rect x="0" y="0" width="1280" height="720" rx="24" fill="#faf9f5"/>
<text x="58" y="78" font-size="43" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#080c18">一笔交易，谁在组织？</text>
<text x="59" y="120" font-size="23" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#586174">传统电商与 Agent Commerce 共用的分析链路</text><rect x="58" y="180" width="252" height="108" rx="16" fill="#f0eee9" stroke="#d9ddd7" stroke-width="1.5"/><text x="78" y="211" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">01</text><text x="184" y="257" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">需求表达</text><rect x="360" y="180" width="252" height="108" rx="16" fill="#f0eee9" stroke="#d9ddd7" stroke-width="1.5"/><text x="380" y="211" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">02</text><text x="486" y="257" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">商品发现与比较</text><rect x="662" y="180" width="252" height="108" rx="16" fill="#f0eee9" stroke="#d9ddd7" stroke-width="1.5"/><text x="682" y="211" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">03</text><text x="788" y="257" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">选择与订单</text><rect x="964" y="180" width="252" height="108" rx="16" fill="#fff0e5" stroke="#c96442" stroke-width="2.5"/><text x="984" y="211" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">04</text><text x="1090" y="257" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">用户委托与授权</text><rect x="964" y="345" width="252" height="108" rx="16" fill="#fff0e5" stroke="#c96442" stroke-width="2.5"/><text x="984" y="376" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">05</text><text x="1090" y="422" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">支付与交易验证</text><rect x="662" y="345" width="252" height="108" rx="16" fill="#f0eee9" stroke="#d9ddd7" stroke-width="1.5"/><text x="682" y="376" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">06</text><text x="788" y="422" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">商家接受订单</text><rect x="360" y="345" width="252" height="108" rx="16" fill="#f0eee9" stroke="#d9ddd7" stroke-width="1.5"/><text x="380" y="376" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">07</text><text x="486" y="422" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">履约与售后</text><rect x="58" y="345" width="252" height="108" rx="16" fill="#f0eee9" stroke="#d9ddd7" stroke-width="1.5"/><text x="78" y="376" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#a2583c" font-weight="700">08</text><text x="184" y="422" text-anchor="middle" font-size="26" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="600">客户关系与复购</text><path d="M315 234 H348" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><path d="M617 234 H650" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><path d="M919 234 H952" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><path d="M1090 294 V333" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><path d="M958 399 H926" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><path d="M656 399 H624" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><path d="M354 399 H322" stroke="#4f6588" stroke-width="2.6" fill="none" marker-end="url(#arr)"/><text x="58" y="504" font-size="25" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#47516a" font-weight="600">贯穿每一个环节的三条分析轴</text><rect x="58" y="533" width="378" height="112" rx="13" fill="#fff" stroke="#e2dfd5" stroke-width="2"/><rect x="58" y="533" width="8" height="112" rx="4" fill="#c96442"/><text x="83" y="577" font-size="27" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="700">控制权</text><text x="83" y="613" font-size="20" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#5a6574">谁决定、批准或阻止？</text><rect x="464" y="533" width="378" height="112" rx="13" fill="#fff" stroke="#e2dfd5" stroke-width="2"/><rect x="464" y="533" width="8" height="112" rx="4" fill="#4f8fff"/><text x="489" y="577" font-size="27" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="700">责任</text><text x="489" y="613" font-size="20" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#5a6574">谁履约、纠错并承担损失？</text><rect x="870" y="533" width="378" height="112" rx="13" fill="#fff" stroke="#e2dfd5" stroke-width="2"/><rect x="870" y="533" width="8" height="112" rx="4" fill="#596f67"/><text x="895" y="577" font-size="27" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#080c18" font-weight="700">经济价值</text><text x="895" y="613" font-size="20" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#5a6574">谁获得收入、降本及复购？</text><text x="59" y="692" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#818893">注：典型分析顺序，实际授权、支付与接单顺序可因业务模式不同而调整。</text></svg>