<text x="1096" y="390" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">支付与交易验证</text>
<rect x="666" y="319" width="252" height="103" rx="15" fill="#f0eee9" stroke="#d8dcd6" stroke-width="1.5"/>
