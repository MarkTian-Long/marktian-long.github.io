<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">一笔交易的八个典型环节与三加一分析结构</title>
<desc id="chart-desc">上半部分列出从需求表达、商品发现到客户关系的八个典型交易环节。下半部分以三个并列问题分析交易如何运行：组织协调、决策授权、履约责任；另以经济回报作为结果层。经济回报到组织协调的虚线箭头仅表示有条件的下一轮投入反馈，不是必然闭环。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#536884" stroke-width="1.7" stroke-linecap="round"/></marker><marker id="return-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#8b877a" stroke-width="1.7" stroke-linecap="round"/></marker></defs>
<rect width="1280" height="1024" rx="24" fill="#faf9f5"/>
<text x="58" y="76" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="44" fill="#080c18" font-weight="700">一笔交易，谁在组织？</text>
<text x="59" y="120" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="23" fill="#566075" font-weight="400">典型交易环节 × 三项运行问题 ＋ 一项经济结果</text>
<text x="59" y="161" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#47566d" font-weight="600">典型交易链：不同业务的授权、支付和接单顺序可以变化</text>
<rect x="58" y="179" width="252" height="103" rx="15" fill="#f0eee9" stroke="#d8dcd6" stroke-width="1.5"/>
<text x="77" y="209" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" fill="#ac6246" font-weight="700">01</text>
<text x="184" y="250" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">需求表达</text>
<rect x="362" y="179" width="252" height="103" rx="15" fill="#f0eee9" stroke="#d8dcd6" stroke-width="1.5"/>
<text x="381" y="209" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" fill="#ac6246" font-weight="700">02</text>
<text x="488" y="250" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">商品发现与比较</text>
<rect x="666" y="179" width="252" height="103" rx="15" fill="#f0eee9" stroke="#d8dcd6" stroke-width="1.5"/>
<text x="685" y="209" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" fill="#ac6246" font-weight="700">03</text>
<text x="792" y="250" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">选择与订单</text>
<rect x="970" y="179" width="252" height="103" rx="15" fill="#fff0e5" stroke="#c96442" stroke-width="2"/>
<text x="989" y="209" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="21" fill="#ac6246" font-weight="700">04</text>
<text x="1096" y="250" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#080c18" font-weight="600" text-anchor="middle">用户委托与授权</text>
<rect x="970" y="319" width="252" height="103" rx="15" fill="#fff0e5" stroke="#c96442" stroke-width="2"/>
