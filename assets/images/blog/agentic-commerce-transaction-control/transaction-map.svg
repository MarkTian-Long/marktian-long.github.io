<path d="M361 371 H320" stroke="#536884" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="45" y="470" width="1190" height="491" rx="21" fill="#fffefd" stroke="#e8e5dd" stroke-width="1.5"/>
<text x="69" y="517" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" fill="#080c18" font-weight="700">3：三个并列的交易运行问题</text>
<text x="1217" y="516" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#677287" font-weight="400" text-anchor="end">不是三个连续步骤</text>
<rect x="69" y="548" width="371" height="150" rx="14" fill="#fff" stroke="#e1ded5" stroke-width="1.5"/>
<rect x="69" y="548" width="8" height="150" rx="4" fill="#c96442"/>
<text x="101" y="608" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="32" fill="#141722" font-weight="700">组织与协调</text>
<text x="101" y="652" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#5f687a" font-weight="400">谁连接各方、推进流程？</text>
<text x="407" y="585" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#c96442" font-weight="600" text-anchor="end">01</text>
<rect x="466" y="548" width="371" height="150" rx="14" fill="#fff" stroke="#e1ded5" stroke-width="1.5"/>
<rect x="466" y="548" width="8" height="150" rx="4" fill="#2563eb"/>
<text x="498" y="608" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="32" fill="#141722" font-weight="700">决策与授权</text>
<text x="498" y="652" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#5f687a" font-weight="400">谁选择、批准或拒绝？</text>
<text x="804" y="585" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#2563eb" font-weight="600" text-anchor="end">02</text>
<rect x="863" y="548" width="371" height="150" rx="14" fill="#fff" stroke="#e1ded5" stroke-width="1.5"/>
<rect x="863" y="548" width="8" height="150" rx="4" fill="#6d8070"/>
<text x="895" y="608" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="32" fill="#141722" font-weight="700">履约与责任</text>
<text x="895" y="652" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="22" fill="#5f687a" font-weight="400">谁交付、补救并担责？</text>
<text x="1201" y="585" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#6d8070" font-weight="600" text-anchor="end">03</text>
<text x="70" y="729" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="27" fill="#435a4c" font-weight="700">＋1：经济结果</text>
<rect x="69" y="750" width="1165" height="133" rx="16" fill="#edf1ed" stroke="#cfdccf" stroke-width="1.5"/>
<rect x="69" y="750" width="9" height="133" rx="4" fill="#6d8070"/>
<text x="98" y="803" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="32" fill="#243e32" font-weight="700">经济回报</text>
<text x="330" y="800" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="24" fill="#344e42" font-weight="600">谁获得收入、承担成本，最终能留住什么回报？</text>
<text x="330" y="845" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" fill="#657b6d" font-weight="400">这是交易运行之后的经营判断，不等于 Agent 已经盈利。</text>
<path d="M1138 887 V928 H28 V617 H67" stroke="#8b877a" stroke-width="2.6" stroke-dasharray="9 9" fill="none" marker-end="url(#return-arrow)"/>
<rect x="409" y="900" width="487" height="36" rx="15" fill="#fffefd"/>
<text x="652" y="927" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="19" fill="#736f65" font-weight="500" text-anchor="middle">仅在回报支持持续投入时，才可能反向影响组织方式</text>
<text x="59" y="997" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="#818893" font-weight="400">本文归纳的诊断工具：不是既有理论的标准四分法，也不是交易权利的穷尽分类。</text>
