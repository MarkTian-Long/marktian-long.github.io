<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><title>三种不同的数学成果认可</title><desc>三张并列卡片分别介绍证明正确、数学价值和学术接受的不同审查对象。</desc><rect width="1280" height="720" fill="#faf9f5"/><text x="640" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172334">同一成果，三类不同判断</text><text x="640" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#647284">彼此相关，但不能用一种认可替代另一种</text><g stroke="#d4d8d9" stroke-width="3" fill="#fff"><rect x="42" y="210" width="384" height="406" rx="26"/><rect x="448" y="210" width="384" height="406" rx="26"/><rect x="854" y="210" width="384" height="406" rx="26"/></g><g text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif"><circle cx="234" cy="306" r="47" fill="#f7e8df"/><text x="234" y="325" font-size="54" font-weight="700" fill="#bf6548">✓</text><text x="234" y="405" font-size="35" font-weight="700" fill="#18283c">证明正确性</text><text x="234" y="459" font-size="23" fill="#526175">命题匹配与公理审计</text><text x="234" y="504" font-size="23" fill="#526175">多内核独立检查</text><text x="234" y="568" font-size="21" fill="#bf6548">判断：是否严格成立？</text><circle cx="640" cy="306" r="47" fill="#e8f0f5"/><path d="M618 322l22-41 22 41" fill="none" stroke="#64839a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="405" font-size="35" font-weight="700" fill="#18283c">数学思想价值</text><text x="640" y="459" font-size="23" fill="#526175">方法的新意与可读性</text><text x="640" y="504" font-size="23" fill="#526175">简化、解释与推广</text><text x="640" y="568" font-size="21" fill="#64839a">判断：带来什么新理解？</text><circle cx="1046" cy="306" r="47" fill="#f0ebe3"/><path d="M1018 286h57M1018 304h57M1018 322h57" fill="none" stroke="#8d7a68" stroke-width="6" stroke-linecap="round"/><text x="1046" y="405" font-size="35" font-weight="700" fill="#18283c">学术制度接受</text><text x="1046" y="459" font-size="23" fill="#526175">发表与同行持续研究</text><text x="1046" y="504" font-size="23" fill="#526175">时间、程序与共同体</text><text x="1046" y="568" font-size="21" fill="#8d7a68">判断：何时完成正式认定？</text></g></svg>