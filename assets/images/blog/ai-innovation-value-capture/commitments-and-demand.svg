<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">客户少用，已承诺的付款也未必减少</title>
<desc id="desc">一边是企业已签订的资源合同，需要按条款付款；另一边是客户按实际使用付费、可以减少使用或不续约。两边没有相同的承诺，收入下降时资源付款仍可能继续。这是定性示意，不是实测数据。</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f4f1e9"/></linearGradient><filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#13273d" flood-opacity=".08"/></filter></defs>
<rect width="1280" height="720" rx="22" fill="url(#paper)"/>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
<text x="64" y="88" font-size="48" font-weight="700" fill="#101d30">客户少用了，已承诺的付款也未必减少</text>
<text x="66" y="137" font-size="27" fill="#637181">买入资源与卖出服务，是两份条件不同的合同。</text>
<g filter="url(#lift)"><rect x="64" y="190" width="552" height="330" rx="22" fill="#edf2f5"/><rect x="664" y="190" width="552" height="330" rx="22" fill="#fbede4"/></g>
<rect x="102" y="229" width="58" height="75" rx="7" fill="#fffefa" stroke="#31516e" stroke-width="3"/><path d="M116 249 H146 M116 264 H146 M116 279 H136" stroke="#31516e" stroke-width="3" stroke-linecap="round"/>
<text x="184" y="259" font-size="34" font-weight="700" fill="#172b43">向上游买资源</text><text x="184" y="299" font-size="25" fill="#637181">算力采购、设备租赁</text>
<text x="104" y="376" font-size="43" font-weight="700" fill="#172b43">合同已经签了</text>
<text x="104" y="437" font-size="31" fill="#31516e">最低采购或固定付款</text><text x="104" y="482" font-size="31" fill="#31516e">可能仍须履行</text>
<circle cx="715" cy="249" r="17" fill="#c96442"/><path d="M687 298 Q690 269 715 269 Q740 269 743 298" fill="#c96442"/>
<circle cx="756" cy="259" r="13" fill="#dba285"/><path d="M735 298 Q737 277 756 277 Q775 277 778 298" fill="#dba285"/>
<text x="800" y="259" font-size="34" font-weight="700" fill="#9e4d34">向客户卖服务</text><text x="800" y="299" font-size="25" fill="#7f6c61">按使用付费、到期续约</text>
<text x="704" y="376" font-size="43" font-weight="700" fill="#9e4d34">客户却可能少用</text>
<text x="704" y="437" font-size="31" fill="#9e4d34">使用、续约与回款</text><text x="704" y="482" font-size="31" fill="#9e4d34">未必同期限锁定</text>
<path d="M340 539 V561 H940 V539" fill="none" stroke="#baa998" stroke-width="2.5" stroke-linecap="round"/>
<rect x="64" y="586" width="1152" height="83" rx="18" fill="#172b43"/>
<text x="640" y="639" text-anchor="middle" font-size="35" font-weight="700" fill="#fffefa">这里的风险：两边承诺不对称</text>
<text x="640" y="704" text-anchor="middle" font-size="19" fill="#75808a">概念示意：具体后果取决于最低采购、取消权、价格和付款条款。</text>
</g></svg>