<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">技术商业化需要四类配套资源</title>
<desc id="desc">中央核心技术与算力供给、产品入口、业务知识与数据、客户关系与交付能力相互连接。四类资源共同支持技术进入真实业务。</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2efe7"/></linearGradient>
 <linearGradient id="coreTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c5b78"/><stop offset="1" stop-color="#1c3048"/></linearGradient>
 <linearGradient id="coreLeft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25445f"/><stop offset="1" stop-color="#102237"/></linearGradient>
 <linearGradient id="coreRight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b43"/><stop offset="1" stop-color="#0a1422"/></linearGradient>
 <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#e9e5da"/></linearGradient>
 <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#172b43" flood-opacity=".13"/></filter>
</defs>
<rect width="1280" height="720" rx="22" fill="url(#paper)"/>
<text x="72" y="78" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#101d30">技术不是终点：商业化需要四类配套资源</text>
<text x="74" y="119" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" fill="#626b76">模型能力要进入真实业务，还需要供给、产品、业务知识与客户交付共同支撑。</text>
<!-- connection lines behind the objects -->
<g fill="none" stroke="#d98a69" stroke-width="5" stroke-linecap="round" opacity=".8">
 <path d="M380 278 C455 278 480 318 520 350"/>
 <path d="M900 278 C825 278 800 318 760 350"/>
 <path d="M380 535 C455 535 485 475 525 445"/>
 <path d="M900 535 C825 535 795 475 755 445"/>
</g>
<g fill="#c96442">
 <circle cx="380" cy="278" r="7"/><circle cx="900" cy="278" r="7"/><circle cx="380" cy="535" r="7"/><circle cx="900" cy="535" r="7"/>
</g>
<!-- top-left platform: compute and supply -->
<g filter="url(#shadow)">
 <polygon points="245,190 410,278 245,366 80,278" fill="url(#tile)" stroke="#ded9ce" stroke-width="2"/>
 <polygon points="80,278 245,366 245,388 80,300" fill="#d4cfc3"/>
 <polygon points="410,278 245,366 245,388 410,300" fill="#e5e0d5"/>
</g>
<g transform="translate(178 204)">
 <rect x="0" y="0" width="35" height="69" rx="7" fill="#243d58"/><rect x="43" y="-12" width="35" height="81" rx="7" fill="#365773"/><rect x="86" y="5" width="35" height="64" rx="7" fill="#172b43"/>
 <g fill="#e9a17f"><rect x="8" y="13" width="19" height="4" rx="2"/><rect x="8" y="28" width="19" height="4" rx="2"/><rect x="51" y="2" width="19" height="4" rx="2"/><rect x="51" y="17" width="19" height="4" rx="2"/><rect x="94" y="18" width="19" height="4" rx="2"/></g>
</g>
<text x="245" y="320" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172b43">算力与供给</text>
<text x="245" y="348" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#687181">训练 · 推理 · 稳定容量</text>
<!-- top-right platform: product and entry -->
<g filter="url(#shadow)">
 <polygon points="1035,190 1200,278 1035,366 870,278" fill="url(#tile)" stroke="#ded9ce" stroke-width="2"/>
 <polygon points="870,278 1035,366 1035,388 870,300" fill="#d4cfc3"/>
 <polygon points="1200,278 1035,366 1035,388 1200,300" fill="#e5e0d5"/>
</g>
<g transform="translate(982 210)">
 <rect x="0" y="0" width="106" height="64" rx="9" fill="#203b58" stroke="#d97757" stroke-width="3"/>
 <rect x="9" y="9" width="88" height="45" rx="4" fill="#e8edf0"/>
 <path d="M23 42 L42 26 L57 35 L80 17" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="53" cy="59" r="3" fill="#e9a17f"/>
</g>
<text x="1035" y="320" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172b43">产品与入口</text>
<text x="1035" y="348" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#687181">产品化 · 权限 · 系统集成</text>
<!-- bottom-left platform: business knowledge and data -->
<g filter="url(#shadow)">
 <polygon points="245,440 410,528 245,616 80,528" fill="url(#tile)" stroke="#ded9ce" stroke-width="2"/>
 <polygon points="80,528 245,616 245,638 80,550" fill="#d4cfc3"/>
 <polygon points="410,528 245,616 245,638 410,550" fill="#e5e0d5"/>
</g>
<g transform="translate(190 455)">
 <path d="M0 12 Q28 -2 56 12 V80 Q28 66 0 80 Z" fill="#e9a17f" stroke="#c96442" stroke-width="3"/>
 <path d="M56 12 Q84 -2 112 12 V80 Q84 66 56 80 Z" fill="#fffefa" stroke="#c96442" stroke-width="3"/>
 <path d="M56 12 V80" stroke="#c96442" stroke-width="3"/>
 <path d="M14 28 Q29 22 43 28 M14 43 Q29 37 43 43 M70 28 Q85 22 99 28 M70 43 Q85 37 99 43" fill="none" stroke="#647b8e" stroke-width="3" stroke-linecap="round"/>
</g>
<text x="245" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#172b43">业务知识与数据</text>
<text x="245" y="609" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#687181">行业规则 · 场景数据 · 上下文</text>
<!-- bottom-right platform: customer relationships and delivery -->
<g filter="url(#shadow)">
 <polygon points="1035,440 1200,528 1035,616 870,528" fill="url(#tile)" stroke="#ded9ce" stroke-width="2"/>
 <polygon points="870,528 1035,616 1035,638 870,550" fill="#d4cfc3"/>
 <polygon points="1200,528 1035,616 1035,638 1200,550" fill="#e5e0d5"/>
</g>
<g transform="translate(980 454)">
 <circle cx="55" cy="18" r="18" fill="#c96442"/><circle cx="22" cy="38" r="14" fill="#4f6f8a"/><circle cx="88" cy="38" r="14" fill="#4f6f8a"/>
 <path d="M24 86 Q25 52 55 52 Q85 52 86 86 Z" fill="#c96442"/>
 <path d="M0 87 Q2 60 22 60 Q43 60 47 87 Z" fill="#4f6f8a"/><path d="M63 87 Q67 60 88 60 Q108 60 110 87 Z" fill="#4f6f8a"/>
</g>
<text x="1035" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#172b43">客户关系与交付</text>
<text x="1035" y="609" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#687181">渠道 · 实施 · 运维</text>
<!-- central technology core -->
<g filter="url(#shadow)">
 <polygon points="640,245 790,330 640,415 490,330" fill="url(#coreTop)" stroke="#e5a184" stroke-width="3"/>
 <polygon points="490,330 640,415 640,535 490,450" fill="url(#coreLeft)"/>
 <polygon points="790,330 640,415 640,535 790,450" fill="url(#coreRight)"/>
 <path d="M640 415 V535" stroke="#d97757" stroke-width="3"/>
</g>
<g fill="#e9a17f"><circle cx="640" cy="300" r="18"/><circle cx="640" cy="300" r="7" fill="#fffefa"/></g>
<text x="640" y="450" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#fffefa">核心技术</text>
<text x="640" y="484" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#e4eaf0">模型 · 算法 · 能力</text>
<text x="640" y="684" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#737a83">同一种资源，对模型厂商和应用公司可能分别是自有能力或外部投入。</text>
</svg>