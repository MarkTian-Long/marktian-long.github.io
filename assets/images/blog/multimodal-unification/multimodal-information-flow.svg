<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">多模态理解和生成：按需判断与两种媒体生成路径</title>
<desc id="desc">文字、图片、音频和视频分别转换为可处理的信息，进入共同上下文并共同理解与推理。若不需要非文本媒体输出，则文字回答；若需要，则进入媒体生成路径，可由模型内专业生成或系统调用专业模型与工具，最终生成语音、图片或视频。模型架构与产品实现可能不同。</desc>
<defs><marker id="arrow-clay" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#b96849"/></marker><marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#778a99"/></marker></defs>
