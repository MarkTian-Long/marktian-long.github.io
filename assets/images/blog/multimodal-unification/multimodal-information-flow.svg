<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
  <title id="title">多模态输入、共同理解、任务判断与媒体生成路径</title>
  <desc id="desc">文字、图片、音频和视频分别转换为可处理的信息，再进入共同上下文与共同理解和推理。判断是否需要非文本媒体输出：不需要就文字回答；需要就进入媒体生成路径，模型内部专业生成和系统调用专业模型或工具两种路径最终都可以输出语音、图片或视频。这是简化示意，不代表通用内部架构。</desc>
  <!-- Arrowheads use fixed user units. Every terminal shaft remains visible and its tip stops 6 units before the target border. -->
  <defs>
    <marker id="arrow-clay" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 5L0 10Z" fill="#b96849"/></marker>
    <marker id="arrow-muted" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 5L0 10Z" fill="#778a99"/></marker>
  </defs>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#152b3c}
    .node{font-weight:650;text-anchor:middle;dominant-baseline:middle}
    .hint{font-size:19px;fill:#526779;text-anchor:middle;dominant-baseline:middle}
    .eyebrow{font-size:21px;fill:#526779;text-anchor:middle;dominant-baseline:middle}
    .branch{font-size:22px;font-weight:700;fill:#b45b39;text-anchor:middle;dominant-baseline:middle}
    .neutral{fill:#fffefc;stroke:#d5cec3;stroke-width:2}
    .focus{fill:#faeee6;stroke:#bc6648;stroke-width:2}
    .decision{fill:#eee1d3;stroke:#b96a4b;stroke-width:2}
    .tool{fill:#f0f4f7;stroke:#7390a5;stroke-width:2}
    .line-muted{fill:none;stroke:#778a99;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
    .line-clay{fill:none;stroke:#b96849;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1280" height="1024" rx="18" fill="#faf9f5" stroke="#e6e1d7" stroke-width="1.5"/>
  <text x="640" y="34" class="eyebrow">多模态理解的一种简化信息流 · 不是通用内部架构</text>

  <g id="node-T"><rect x="46" y="61" width="273" height="63" rx="13" class="neutral"/>
    <text x="182.5" y="92.5" class="node" font-size="30">文字</text>
  </g>
  <path data-from="T" data-to="E" d="M182.5 124V141" class="line-muted"/>
  <g id="node-I"><rect x="351" y="61" width="273" height="63" rx="13" class="neutral"/>
    <text x="487.5" y="92.5" class="node" font-size="30">图片</text>
  </g>
  <path data-from="I" data-to="E" d="M487.5 124V141" class="line-muted"/>
  <g id="node-A"><rect x="656" y="61" width="273" height="63" rx="13" class="neutral"/>
    <text x="792.5" y="92.5" class="node" font-size="30">音频</text>
  </g>
  <path data-from="A" data-to="E" d="M792.5 124V141" class="line-muted"/>
  <g id="node-V"><rect x="961" y="61" width="273" height="63" rx="13" class="neutral"/>
    <text x="1097.5" y="92.5" class="node" font-size="30">视频</text>
  </g>
  <path data-from="V" data-to="E" d="M1097.5 124V141" class="line-muted"/>
  <path d="M182.5 141H1097.5" class="line-muted"/>
  <path data-arrow-to="E" d="M640 141V174" class="line-muted" marker-end="url(#arrow-muted)"/>
  <g id="node-E"><rect x="354" y="180" width="572" height="62" rx="13" class="neutral"/>
    <text x="640" y="211" class="node" font-size="29">分别转换为可处理的信息</text>
  </g>
  <path data-from="E" data-to="C" d="M640 242V273" class="line-clay" marker-end="url(#arrow-clay)"/>
  <g id="node-C"><rect x="354" y="279" width="572" height="62" rx="13" class="focus"/>
    <text x="640" y="310" class="node" font-size="30">进入共同上下文</text>
  </g>
  <path data-from="C" data-to="R" d="M640 341V374" class="line-clay" marker-end="url(#arrow-clay)"/>
  <g id="node-R"><rect x="354" y="380" width="572" height="62" rx="13" class="focus"/>
    <text x="640" y="411" class="node" font-size="30">共同理解与推理</text>
  </g>
  <path data-from="R" data-to="D" d="M640 442V476" class="line-clay" marker-end="url(#arrow-clay)"/>
  <g id="node-D"><rect x="354" y="482" width="572" height="70" rx="13" class="decision"/>
    <text x="640" y="517" class="node" font-size="30">需要非文本媒体输出吗？</text>
  </g>
  <path d="M640 552V583" class="line-clay"/>
  <path data-from="D" data-to="TX" data-guard="不需要" d="M640 583H278.5V653" class="line-clay" marker-end="url(#arrow-clay)"/>
  <path data-from="D" data-to="M" data-guard="需要" d="M640 583H1000.5V653" class="line-clay" marker-end="url(#arrow-clay)"/>
  <text x="356" y="616" class="branch">不需要</text>
  <text x="1102" y="616" class="branch">需要</text>
  <g id="node-TX"><rect x="76" y="659" width="405" height="91" rx="13" class="neutral"/>
    <text x="278.5" y="695" class="node" font-size="31">文字回答</text>
    <text x="278.5" y="729" class="hint">无需额外媒体生成</text></g>
  <g id="node-M"><rect x="779" y="659" width="443" height="65" rx="13" class="focus"/>
    <text x="1000.5" y="691.5" class="node" font-size="29">媒体生成路径</text>
  </g>
  <path data-from="M" data-to="G" d="M1000.5 724V758H781V796" class="line-clay" marker-end="url(#arrow-clay)"/>
  <path data-from="M" data-to="P" d="M1000.5 758H1089V796" class="line-clay" marker-end="url(#arrow-clay)"/>
  <g id="node-G"><rect x="639" y="802" width="284" height="85" rx="13" class="neutral"/>
    <text x="781" y="844.5" class="node" font-size="26">模型内专业生成</text>
  </g>
  <g id="node-P"><rect x="944" y="802" width="290" height="85" rx="13" class="tool"/>
    <text x="1089" y="829" class="node" font-size="25">系统调用专业</text>
    <text x="1089" y="860" class="node" font-size="25">模型 / 工具</text>
  </g>
  <path data-from="G" data-to="O" d="M781 887V915H1000" class="line-clay"/>
  <path data-from="P" data-to="O" d="M1089 887V915H1000" class="line-clay"/>
  <path data-arrow-to="O" d="M1000 915V945" class="line-clay" marker-end="url(#arrow-clay)"/>
  <g id="node-O"><rect x="802" y="951" width="396" height="55" rx="13" class="focus"/>
    <text x="1000" y="978.5" class="node" font-size="27">语音 / 图片 / 视频</text>
  </g>
</svg>
