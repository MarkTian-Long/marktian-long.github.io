<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1150" viewBox="0 0 720 1150" role="img" aria-labelledby="title desc"><title id="title">买建组合判断框架</title><desc id="desc">先定义任务，再分别检查需求特殊性、跨客户复用和变化治理，最后复核内部承接能力与风险，选择自建、采购或组合。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#c96442" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><g><text x="360" y="58" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#080c18" text-anchor="middle">买、建还是组合？</text><text x="360" y="98" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="middle">本文归纳的判断框架，不是硬性行业规则</text><rect x="40" y="130" width="640" height="96" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="360" y="168" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#080c18" text-anchor="middle">先定义任务与验收标准</text><text x="360" y="202" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="middle">要完成什么？什么结果算通过？</text><path d="M360 226 L360 262" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="275" width="640" height="152" rx="18" fill="#f6e9e2" stroke="#ddd9d1" stroke-width="2"/><text x="64" y="317" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#c96442" text-anchor="start">1  需求特殊性</text><text x="64" y="357" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" fill="#080c18" text-anchor="start">客户独有流程、规则变化快</text><text x="64" y="394" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="start">越高，越值得考虑自建或定制。</text><rect x="40" y="447" width="640" height="152" rx="18" fill="#eaf2ff" stroke="#ddd9d1" stroke-width="2"/><text x="64" y="489" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#2563eb" text-anchor="start">2  跨客户复用</text><text x="64" y="529" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" fill="#080c18" text-anchor="start">多个客户需要相近的能力</text><text x="64" y="566" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="start">越高，越可能由采购共享成本。</text><rect x="40" y="619" width="640" height="152" rx="18" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/><text x="64" y="661" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#626a76" text-anchor="start">3  变化与治理</text><text x="64" y="701" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="500" fill="#080c18" text-anchor="start">系统耦合、风险和恢复要求</text><text x="64" y="738" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="start">越复杂，越要核算协调与责任边界。</text><path d="M360 771 L360 806" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="814" width="640" height="100" rx="18" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/><text x="360" y="853" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#080c18" text-anchor="middle">再核验两个门槛</text><text x="360" y="888" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#626a76" text-anchor="middle">内部能否持续承接？风险与退出成本能否接受？</text><path d="M360 914 L360 949" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="960" width="216" height="120" rx="16" fill="#f6e9e2" stroke="#c96442" stroke-width="2"/><text x="132" y="1006" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#c96442" text-anchor="middle">自建 / 定制</text><text x="132" y="1042" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#626a76" text-anchor="middle">独特任务，内部可承接</text><rect x="252" y="960" width="216" height="120" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="360" y="1006" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="middle">采购</text><text x="360" y="1042" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#626a76" text-anchor="middle">共性能力，复用划算</text><rect x="480" y="960" width="216" height="120" rx="16" fill="#e9f4eb" stroke="#287a52" stroke-width="2"/><text x="588" y="1006" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#287a52" text-anchor="middle">组合</text><text x="588" y="1042" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#626a76" text-anchor="middle">差异自控，通用外购</text><text x="360" y="1120" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#c96442" text-anchor="middle">这是比较起点；任务、时间和组织能力变化后，选择也应重算。</text></g></svg>