<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc">
<title id="title">自建、采购还是组合？</title>
<desc id="desc">先定义任务和验收标准，再同时评估需求特殊性、跨客户复用、变化与治理三个并列维度。最后核验内部承接能力与风险，选择自建、采购或组合。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#c96442" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#faf9f5"/>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<text x="360" y="58" font-size="36" font-weight="700" fill="#080c18" text-anchor="middle">买、建还是组合？</text>
<text x="360" y="98" font-size="22" fill="#626a76" text-anchor="middle">本文归纳的判断框架，不是硬性行业规则</text>
<rect x="40" y="130" width="640" height="105" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
<text x="360" y="172" font-size="28" font-weight="700" fill="#080c18" text-anchor="middle">先定义任务与验收标准</text>
<text x="360" y="207" font-size="22" fill="#626a76" text-anchor="middle">要完成什么？什么结果算通过？</text>
<path d="M360 235 L360 275" fill="none" stroke="#c96442" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="285" width="640" height="575" rx="20" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/>
<text x="360" y="326" font-size="27" font-weight="700" fill="#080c18" text-anchor="middle">同时评估的三个并列维度</text>
<text x="360" y="357" font-size="19" fill="#626a76" text-anchor="middle">不是先后步骤；各维度共同影响选择</text>
<rect x="66" y="382" width="588" height="125" rx="15" fill="#f6e9e2" stroke="#e6c6b8" stroke-width="1.5"/>
<text x="90" y="419" font-size="25" font-weight="700" fill="#c96442">需求特殊性</text>
<text x="90" y="456" font-size="22" fill="#080c18">客户独有流程、规则与体验差异</text>
<text x="90" y="485" font-size="20" fill="#626a76">越特殊，越值得评估自建或定制</text>
<rect x="66" y="525" width="588" height="125" rx="15" fill="#eaf2ff" stroke="#bfd4fa" stroke-width="1.5"/>
<text x="90" y="562" font-size="25" font-weight="700" fill="#2563eb">跨客户复用</text>
<text x="90" y="599" font-size="22" fill="#080c18">多个客户是否需要相近能力</text>
<text x="90" y="628" font-size="20" fill="#626a76">复用越充分，采购越可能摊薄成本</text>
<rect x="66" y="668" width="588" height="125" rx="15" fill="#ffffff" stroke="#ddd9d1" stroke-width="1.5"/>
<text x="90" y="705" font-size="25" font-weight="700" fill="#626a76">变化与治理</text>
<text x="90" y="742" font-size="22" fill="#080c18">系统耦合、风险、恢复与协调责任</text>
<text x="90" y="771" font-size="20" fill="#626a76">越复杂，越要明确边界与承接能力</text>
<path d="M360 860 L360 900" fill="none" stroke="#c96442" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="910" width="640" height="108" rx="18" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/>
<text x="360" y="952" font-size="26" font-weight="700" fill="#080c18" text-anchor="middle">再核验两个约束</text>
<text x="360" y="987" font-size="21" fill="#626a76" text-anchor="middle">内部能否持续承接？风险与退出成本能否接受？</text>
<path d="M360 1018 L360 1056" fill="none" stroke="#c96442" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="1090" font-size="25" font-weight="700" fill="#080c18" text-anchor="middle">可选安排（可按模块组合）</text>
<rect x="66" y="1110" width="588" height="82" rx="15" fill="#f6e9e2" stroke="#e6c6b8" stroke-width="1.5"/>
<text x="90" y="1143" font-size="24" font-weight="700" fill="#c96442">自建 / 定制</text>
<text x="90" y="1175" font-size="20" fill="#626a76">独特任务，且内部能够持续承接</text>
<rect x="66" y="1207" width="588" height="82" rx="15" fill="#eaf2ff" stroke="#bfd4fa" stroke-width="1.5"/>
<text x="90" y="1240" font-size="24" font-weight="700" fill="#2563eb">采购</text>
<text x="90" y="1272" font-size="20" fill="#626a76">共性能力，供应商复用更划算</text>
<rect x="66" y="1304" width="588" height="82" rx="15" fill="#e9f4eb" stroke="#b9d8c3" stroke-width="1.5"/>
<text x="90" y="1337" font-size="24" font-weight="700" fill="#287a52">组合</text>
<text x="90" y="1369" font-size="20" fill="#626a76">差异自控，通用能力外购</text>
<text x="360" y="1420" font-size="19" fill="#c96442" text-anchor="middle">任务、时间和组织能力变化后，应重新评估。</text>
</g></svg>