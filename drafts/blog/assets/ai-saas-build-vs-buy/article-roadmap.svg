<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">文章递进路线</title><desc id="desc">五个环节：软件复刻现象、传统采购逻辑、双方成本变化、SaaS 定价影响与买建决策。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#c96442" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#faf9f5"/><g><text x="360" y="58" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#080c18" text-anchor="middle">这篇文章怎样推进问题</text><text x="360" y="98" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="middle">从软件复刻的现象，走到买与建的经济边界</text><rect x="38" y="135" width="644" height="150" rx="18" fill="#eaf2ff" stroke="#ddd9d1" stroke-width="2"/><circle cx="82" cy="178" r="25" fill="#2563eb"/><text x="82" y="187" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">01</text><text x="125" y="180" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#080c18" text-anchor="start">现象：软件更容易重建</text><text x="125" y="220" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">PhotoCraft、REA 与 Swyx 显示，</text><text x="125" y="254" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">重建功能的门槛正在下降。</text><path d="M360 286 L360 312" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="38" y="316" width="644" height="150" rx="18" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/><circle cx="82" cy="359" r="25" fill="#626a76"/><text x="82" y="368" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">02</text><text x="125" y="361" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#080c18" text-anchor="start">背景：过去为什么更愿意买？</text><text x="125" y="401" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">供应商把研发、运行和维护投入</text><text x="125" y="435" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">分摊给多家客户。</text><path d="M360 467 L360 493" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="38" y="497" width="644" height="150" rx="18" fill="#f6e9e2" stroke="#ddd9d1" stroke-width="2"/><circle cx="82" cy="540" r="25" fill="#c96442"/><text x="82" y="549" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">03</text><text x="125" y="542" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#080c18" text-anchor="start">机制：AI 同时改变双方成本</text><text x="125" y="582" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">客户更易自建，供应商也更易</text><text x="125" y="616" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">开发、维护与提供定制。</text><path d="M360 648 L360 674" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="38" y="678" width="644" height="150" rx="18" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/><circle cx="82" cy="721" r="25" fill="#626a76"/><text x="82" y="730" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">04</text><text x="125" y="723" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#080c18" text-anchor="start">商业影响：价值与定价可能分离</text><text x="125" y="763" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">客户即使继续采购，可信替代</text><text x="125" y="797" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">也可能改变议价条件。</text><path d="M360 829 L360 855" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="38" y="859" width="644" height="150" rx="18" fill="#e9f4eb" stroke="#ddd9d1" stroke-width="2"/><circle cx="82" cy="902" r="25" fill="#287a52"/><text x="82" y="911" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">05</text><text x="125" y="904" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#080c18" text-anchor="start">决策：哪些自己做，哪些继续买？</text><text x="125" y="944" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">按需求特殊性、共同复用与</text><text x="125" y="978" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">变化治理划分责任。</text><text x="360" y="1075" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#c96442" text-anchor="middle">核心问题：谁能更经济地持续处理下一次业务变化？</text></g></svg>