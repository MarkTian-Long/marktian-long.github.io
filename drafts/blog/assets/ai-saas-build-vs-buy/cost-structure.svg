<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">AI 改变软件成本结构</title><desc id="desc">建设开发成本通常下降；维护迭代可能下降；运行模型调用视场景变化；协调验收与风险不会自动归零。</desc><rect width="100%" height="100%" fill="#faf9f5"/><g><text x="360" y="58" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#080c18" text-anchor="middle">AI 改变了哪些软件成本？</text><text x="360" y="98" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#626a76" text-anchor="middle">方向示意：不代表成本比例或行业平均值</text><rect x="38" y="145" width="644" height="170" rx="18" fill="#eaf2ff" stroke="#ddd9d1" stroke-width="2"/><text x="65" y="188" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#080c18" text-anchor="start">建设 / 开发</text><rect x="460" y="162" width="190" height="42" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="555" y="190" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">通常下降</text><text x="65" y="241" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">AI 编码降低初版实现与修改门槛。</text><rect x="38" y="335" width="644" height="170" rx="18" fill="#e9f4eb" stroke="#ddd9d1" stroke-width="2"/><text x="65" y="378" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#080c18" text-anchor="start">维护 / 迭代</text><rect x="460" y="352" width="190" height="42" rx="12" fill="#287a52" stroke="#287a52" stroke-width="1"/><text x="555" y="380" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">可能下降</text><text x="65" y="431" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">测试、排错和升级可部分自动化，</text><text x="65" y="465" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">但验收与责任仍在。</text><rect x="38" y="525" width="644" height="170" rx="18" fill="#f6e9e2" stroke="#ddd9d1" stroke-width="2"/><text x="65" y="568" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#080c18" text-anchor="start">运行 / 模型调用</text><rect x="460" y="542" width="190" height="42" rx="12" fill="#c96442" stroke="#c96442" stroke-width="1"/><text x="555" y="570" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">视场景变化</text><text x="65" y="621" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">运行时调用模型，推理、监控与</text><text x="65" y="655" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">集成费用可能增加。</text><rect x="38" y="715" width="644" height="170" rx="18" fill="#ffffff" stroke="#ddd9d1" stroke-width="2"/><text x="65" y="758" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#080c18" text-anchor="start">协调 / 验收 / 风险</text><rect x="460" y="732" width="190" height="42" rx="12" fill="#626a76" stroke="#626a76" stroke-width="1"/><text x="555" y="760" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">不会自动归零</text><text x="65" y="811" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">需求澄清、业务验收、权限与</text><text x="65" y="845" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#626a76" text-anchor="start">故障恢复仍需要组织。</text><text x="360" y="930" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#080c18" text-anchor="middle">客户自建与供应商交付，都会受到这些变化影响。</text><text x="360" y="968" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#c96442" text-anchor="middle">比较的是双方采用 AI 后的相对优势，而非 AI 与传统 SaaS。</text></g></svg>