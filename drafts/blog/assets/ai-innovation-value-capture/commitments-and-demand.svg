<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">长期资源承诺与收入兑现可能错位</title><desc id="desc">长期采购和租赁付款义务可能在合同期内持续发生，而收入随实际用量和客户续约变化。需求不足时，企业仍可能承担固定付款义务。图为概念示意，不含实际金额或期限。</desc><rect width="1280" height="720" rx="22" fill="#faf9f5"/><text x="64" y="88" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" fill="#080c18">长期资源承诺与收入兑现，节奏可能错位</text><text x="64" y="132" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596270">企业先锁定算力或设备，不代表客户需求和收入也被同步锁定。</text><g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="72" y="250" font-size="36" font-weight="700" fill="#172b43">资源承诺</text><text x="72" y="294" font-size="26" fill="#596270">合同约定</text><text x="72" y="468" font-size="36" font-weight="700" fill="#c96442">收入兑现</text><text x="72" y="512" font-size="26" fill="#596270">实际需求</text></g><rect x="330" y="205" width="850" height="72" rx="14" fill="#172b43"/><rect x="330" y="205" width="850" height="72" rx="14" fill="none" stroke="#4f6f8a" stroke-width="2"/><g fill="#e9a17f"><circle cx="360" cy="241" r="7"/><circle cx="640" cy="241" r="7"/><circle cx="910" cy="241" r="7"/><circle cx="1150" cy="241" r="7"/></g><text x="755" y="251" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#faf9f5">最低采购 · 租赁付款 · 持续履约</text><rect x="330" y="385" width="850" height="104" rx="14" fill="#f3eee5"/><rect x="350" y="416" width="150" height="42" rx="9" fill="#c96442"/><rect x="548" y="416" width="78" height="42" rx="9" fill="#d97757"/><rect x="696" y="416" width="190" height="42" rx="9" fill="#c96442"/><rect x="950" y="416" width="90" height="42" rx="9" fill="#d97757"/><rect x="1090" y="416" width="70" height="42" rx="9" fill="#c96442"/><g stroke="#b9b4aa" stroke-width="2" stroke-dasharray="5 8"><path d="M520 395 V480"/><path d="M650 395 V480"/><path d="M910 395 V480"/><path d="M1060 395 V480"/></g><text x="755" y="535" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#596270">实际用量与客户续约，随需求变化</text><path d="M360 315 V350 H1150 V315" fill="none" stroke="#c96442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><rect x="440" y="565" width="400" height="74" rx="14" fill="#f6e9e0" stroke="#e9a17f" stroke-width="2"/><text x="640" y="611" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#9f4e35">需求不足时，义务仍可能继续</text><text x="870" y="610" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#596270">概念示意 · 非金额或期限比例</text></svg>