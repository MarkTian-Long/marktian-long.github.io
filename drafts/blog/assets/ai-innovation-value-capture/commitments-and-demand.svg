<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">资源承诺与收入节奏</title><desc id="desc">左侧是长期资源安排中的最低采购与付款承诺，右侧是随客户使用和续约变化的收入，两侧承诺不对应时需要承担利用率与现金流风险。概念示意，不含公司实测金额。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c96442"/></marker></defs><rect width="1280" height="720" rx="24" fill="#faf9f5"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" fill="#080c18"><text x="64" y="96" font-size="64" font-weight="600" text-anchor="start" fill="#080c18">资源到手，义务也可能到手</text><rect x="56" y="164" width="550" height="350" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><rect x="674" y="164" width="550" height="350" rx="18" fill="#f6e9e0" stroke="#e8e6dc" stroke-width="2"/><text x="331" y="250" font-size="56" font-weight="600" text-anchor="middle" fill="#080c18">先锁定资源</text><text x="949" y="250" font-size="56" font-weight="600" text-anchor="middle" fill="#080c18">收入仍会变化</text><text x="331" y="350" font-size="52" font-weight="400" text-anchor="middle" fill="#5e5d59">最低采购</text><text x="949" y="350" font-size="52" font-weight="400" text-anchor="middle" fill="#5e5d59">实际用量</text><text x="331" y="438" font-size="52" font-weight="400" text-anchor="middle" fill="#5e5d59">持续付款</text><text x="949" y="438" font-size="52" font-weight="400" text-anchor="middle" fill="#5e5d59">客户续约</text><path d="M331 514V555H610V578" fill="none" stroke="#c96442" stroke-width="5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M949 514V555H670V578" fill="none" stroke="#c96442" stroke-width="5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="200" y="592" width="880" height="80" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><text x="640" y="646" font-size="54" font-weight="600" text-anchor="middle" fill="#080c18">利用率与现金流风险</text></g></svg>