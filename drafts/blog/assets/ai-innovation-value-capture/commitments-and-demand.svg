<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">长期资源承诺与收入兑现可能错位</title>
<desc id="desc">同一合同期内，最低采购、租赁付款等资源义务持续存在；实际用量和收入随客户需求变化，两者之间可能形成潜在缺口。图为概念示意，不代表实际金额或期限。</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2efe7"/></linearGradient>
 <linearGradient id="gap" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9a17f" stop-opacity=".32"/><stop offset="1" stop-color="#e9a17f" stop-opacity=".08"/></linearGradient>
 <linearGradient id="demand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7da0bd" stop-opacity=".3"/><stop offset="1" stop-color="#7da0bd" stop-opacity=".04"/></linearGradient>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#172b43" flood-opacity=".1"/></filter>
</defs>
<rect width="1280" height="720" rx="22" fill="url(#paper)"/>
<text x="72" y="82" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#101d30">长期资源承诺与收入兑现，可能不在同一节奏</text>
<text x="74" y="124" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" fill="#626b76">企业先锁定算力或设备，不代表客户需求和收入也被同步锁定。</text>
<!-- lane labels -->
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
 <text x="82" y="238" font-size="30" font-weight="700" fill="#172b43">资源承诺</text>
 <text x="82" y="274" font-size="21" fill="#687181">合同约定</text>
 <text x="82" y="440" font-size="30" font-weight="700" fill="#4f6f8a">收入兑现</text>
 <text x="82" y="476" font-size="21" fill="#687181">实际需求</text>
</g>
<!-- top fixed commitment band -->
<g filter="url(#shadow)">
 <rect x="310" y="196" width="850" height="96" rx="16" fill="#203b58"/>
</g>
<g fill="#e9a17f">
 <circle cx="350" cy="244" r="8"/><circle cx="570" cy="244" r="8"/><circle cx="790" cy="244" r="8"/><circle cx="1010" cy="244" r="8"/><circle cx="1120" cy="244" r="8"/>
</g>
<text x="735" y="237" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#fffefa">最低采购 · 租赁付款 · 持续履约</text>
<text x="735" y="270" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#dce4ec">合同义务按约定持续发生</text>
<!-- gap region -->
<path d="M310 310 L1160 310 L1160 408 C1080 388 1030 375 950 402 C870 432 820 386 735 412 C650 438 600 394 520 420 C440 446 380 402 310 426 Z" fill="url(#gap)"/>
<path d="M310 310 H1160" stroke="#c96442" stroke-width="4" stroke-linecap="round"/>
<text x="735" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#a95336">潜在缺口：承诺的资源成本可能高于当期需求</text>
<!-- actual use / revenue curve -->
<path d="M310 552 L310 426 C380 402 440 446 520 420 C600 394 650 438 735 412 C820 386 870 432 950 402 C1030 375 1080 388 1160 408 L1160 552 Z" fill="url(#demand)"/>
<path d="M310 426 C380 402 440 446 520 420 C600 394 650 438 735 412 C820 386 870 432 950 402 C1030 375 1080 388 1160 408" fill="none" stroke="#4f6f8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#4f6f8a" stroke="#fffefa" stroke-width="3">
 <circle cx="310" cy="426" r="7"/><circle cx="520" cy="420" r="7"/><circle cx="735" cy="412" r="7"/><circle cx="950" cy="402" r="7"/><circle cx="1160" cy="408" r="7"/>
</g>
<text x="735" y="493" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#31516e">实际用量与客户续约，随需求变化</text>
<!-- time axis -->
<path d="M310 570 H1160" stroke="#8c969e" stroke-width="2.5" stroke-linecap="round"/>
<path d="M1148 563 L1160 570 L1148 577" fill="none" stroke="#8c969e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="735" y="610" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#687181">同一合同期内的时间推进（概念示意）</text>
<!-- legend -->
<g transform="translate(310 650)" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18">
 <rect x="0" y="-13" width="22" height="14" rx="4" fill="#203b58"/><text x="32" y="0" fill="#596270">合同义务</text>
 <path d="M190 -6 H220" stroke="#4f6f8a" stroke-width="4" stroke-linecap="round"/><text x="230" y="0" fill="#596270">实际需求 / 收入</text>
 <rect x="430" y="-13" width="22" height="14" rx="4" fill="#e9a17f" opacity=".65"/><text x="462" y="0" fill="#596270">潜在缺口</text>
</g>
<text x="1160" y="672" text-anchor="end" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" fill="#8a8d91">非实际金额、期限或公司数据</text>
</svg>