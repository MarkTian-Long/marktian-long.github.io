<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">三个不同的价值口径</title><desc id="desc">客户价值关注业务结果，企业回报关注扣除持续成本后保留的经济收益，市场估值关注资本市场对未来股权回报的定价。三者相关但不能互相替代。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf9f5"/><stop offset="1" stop-color="#f0eee6"/></linearGradient></defs><rect width="1280" height="720" rx="22" fill="url(#bg)"/><text x="64" y="88" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" fill="#080c18">三个不同的价值口径</text><text x="64" y="132" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#596270">同一项技术可以同时改变三种口径，但它们回答的不是同一个问题。</text><path d="M432 190 V570 M848 190 V570" stroke="#dedbd2" stroke-width="2"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle"><circle cx="224" cy="260" r="72" fill="#e5edf2"/><circle cx="224" cy="235" r="20" fill="#4f6f8a"/><path d="M176 304 Q181 265 224 265 Q267 265 272 304 Z" fill="#4f6f8a"/><circle cx="280" cy="245" r="14" fill="#c96442"/><path d="M258 292 Q260 266 280 266 Q300 266 302 292 Z" fill="#c96442"/><text x="224" y="390" font-size="44" font-weight="700" fill="#080c18">客户价值</text><text x="224" y="432" font-size="27" fill="#c96442">业务结果</text><text x="224" y="492" font-size="28" fill="#596270">效率提升 · 成本下降</text><text x="224" y="532" font-size="28" fill="#596270">收入增长 · 体验改善</text><text x="224" y="585" font-size="27" font-weight="600" fill="#080c18">客户得到什么改善？</text><circle cx="640" cy="260" r="72" fill="#f6e9e0"/><path d="M590 300 H690" stroke="#c96442" stroke-width="8" stroke-linecap="round"/><rect x="598" y="265" width="18" height="35" rx="4" fill="#e9a17f"/><rect x="631" y="238" width="18" height="62" rx="4" fill="#c96442"/><rect x="664" y="215" width="18" height="85" rx="4" fill="#c96442"/><text x="640" y="390" font-size="44" font-weight="700" fill="#080c18">企业回报</text><text x="640" y="432" font-size="27" fill="#c96442">经济收益</text><text x="640" y="492" font-size="28" fill="#596270">毛利 · 现金流</text><text x="640" y="532" font-size="28" fill="#596270">可持续利润</text><text x="640" y="585" font-size="27" font-weight="600" fill="#080c18">扣除持续成本后留下多少？</text><circle cx="1056" cy="260" r="72" fill="#e9eaf1"/><path d="M1008 300 V228 M1008 300 H1104" stroke="#4f6f8a" stroke-width="5" stroke-linecap="round"/><path d="M1020 280 L1045 255 L1065 265 L1096 220" fill="none" stroke="#c96442" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1020" cy="280" r="5" fill="#c96442"/><circle cx="1045" cy="255" r="5" fill="#c96442"/><circle cx="1065" cy="265" r="5" fill="#c96442"/><circle cx="1096" cy="220" r="5" fill="#c96442"/><text x="1056" y="390" font-size="44" font-weight="700" fill="#080c18">市场估值</text><text x="1056" y="432" font-size="27" fill="#c96442">未来预期</text><text x="1056" y="492" font-size="28" fill="#596270">未来现金流 · 实现时间</text><text x="1056" y="532" font-size="28" fill="#596270">风险 · 资金供求</text><text x="1056" y="585" font-size="27" font-weight="600" fill="#080c18">投资者今天愿意付多少钱？</text></g><rect x="64" y="630" width="1152" height="54" rx="12" fill="#eae6dc"/><text x="640" y="666" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" fill="#172b43">三者有关联，但不能互相替代</text></svg>