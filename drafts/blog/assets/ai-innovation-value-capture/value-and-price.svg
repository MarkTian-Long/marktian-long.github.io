<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">三个不同的问题</title><desc id="desc">创造价值关注客户结果，捕获价值关注企业保留的回报，估值关注资本市场对未来股权回报的定价。三者不是顺序阶段。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c96442"/></marker></defs><rect width="1280" height="720" rx="24" fill="#faf9f5"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" fill="#080c18"><text x="64" y="96" font-size="64" font-weight="600" text-anchor="start" fill="#080c18">三个不同的问题</text><rect x="56" y="150" width="1168" height="140" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><rect x="56" y="172" width="7" height="96" rx="3" fill="#c96442"/><text x="96" y="237" font-size="56" font-weight="600" text-anchor="start" fill="#080c18">创造价值</text><text x="440" y="237" font-size="52" font-weight="400" text-anchor="start" fill="#080c18">客户得到什么改善？</text><rect x="56" y="330" width="1168" height="140" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><rect x="56" y="352" width="7" height="96" rx="3" fill="#c96442"/><text x="96" y="417" font-size="56" font-weight="600" text-anchor="start" fill="#080c18">捕获价值</text><text x="440" y="417" font-size="52" font-weight="400" text-anchor="start" fill="#080c18">企业能留下多少回报？</text><rect x="56" y="510" width="1168" height="140" rx="18" fill="#f6e9e0" stroke="#e8e6dc" stroke-width="2"/><rect x="56" y="532" width="7" height="96" rx="3" fill="#c96442"/><text x="96" y="597" font-size="56" font-weight="600" text-anchor="start" fill="#080c18">市场定价</text><text x="440" y="597" font-size="52" font-weight="400" text-anchor="start" fill="#080c18">未来回报今天值多少？</text></g></svg>