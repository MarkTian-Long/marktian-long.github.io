<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
<title id="title">市场估值怎样通过融资条件影响经营</title>
<desc id="desc">回报预期影响市场定价。仅当企业需要外部融资或股权支付时，市场定价才可能进一步改变融资条件和投资安排；没有近期融资依赖时，短期直接传导较弱。经营结果将再次修正未来回报预期。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f4f1e9"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29445e"/><stop offset="1" stop-color="#111e30"/></linearGradient>
  <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#15283d" flood-opacity=".11"/></filter>
  <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c96442"/></marker>
  <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4b6d89"/></marker>
</defs>
<rect width="1280" height="1024" rx="24" fill="url(#bg)"/>
<rect x="2" y="2" width="1276" height="1020" rx="22" fill="none" stroke="#e4e0d7" stroke-width="2"/>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
  <rect x="68" y="48" width="7" height="45" rx="3.5" fill="#c96442"/>
  <text x="96" y="87" font-size="45" font-weight="700" fill="#101d30">市场估值怎样反馈到企业经营？</text>
  <text x="97" y="128" font-size="25" fill="#596270">不是价格一变化就影响现金；是否需要融资，才决定后续传导。</text>
</g>
<!-- Top: future return expectations and equity market pricing. -->
<g filter="url(#shadow)">
  <rect x="142" y="179" width="402" height="108" rx="17" fill="#fffefa" stroke="#e5dfd5" stroke-width="2"/>
  <rect x="751" y="179" width="402" height="108" rx="17" fill="#fffefa" stroke="#e5dfd5" stroke-width="2"/>
</g>
<path d="M563 233 H731" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrOrange)"/>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
  <rect x="167" y="205" width="15" height="40" rx="4" fill="#355b78"/>
  <rect x="190" y="198" width="15" height="47" rx="4" fill="#4b6d89"/>
  <rect x="213" y="191" width="15" height="54" rx="4" fill="#c96442"/>
  <text x="253" y="231" font-size="34" font-weight="700" fill="#172b43">未来回报预期</text>
  <text x="253" y="267" font-size="23" fill="#687382">多少 · 多久 · 多大风险</text>
  <rect x="780" y="201" width="66" height="52" rx="9" fill="#284761"/>
  <rect x="788" y="209" width="50" height="36" rx="4" fill="#f2f5f6"/>
  <path d="M795 235 L807 224 L819 229 L831 215" fill="none" stroke="#c96442" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="875" y="231" font-size="34" font-weight="700" fill="#a85135">市场定价</text>
  <text x="875" y="267" font-size="23" fill="#687382">股权价格 · 估值预期</text>
</g>
<!-- Connections use dedicated corridors and stop before card edges. -->
<path d="M951 301 V323 H647 V340" fill="none" stroke="#c96442" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrOrange)"/>
<g filter="url(#shadow)"><rect x="300" y="356" width="694" height="108" rx="18" fill="url(#navy)" stroke="#a66d59" stroke-width="2"/></g>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
  <circle cx="351" cy="411" r="24" fill="#e6a389"/>
  <path d="M338 407 L350 396 L363 407 L350 421 Z" fill="#fff4eb"/>
  <text x="682" y="403" text-anchor="middle" font-size="37" font-weight="700" fill="#fffefa">企业是否需要外部融资或股权支付？</text>
  <text x="682" y="440" text-anchor="middle" font-size="22" fill="#d7e2e9">现金储备、经营回款和扩张计划决定答案</text>
</g>
<path d="M476 479 V516 H342 V548" fill="none" stroke="#4b6d89" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrBlue)"/>
<path d="M820 479 V516 H934 V548" fill="none" stroke="#c96442" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrOrange)"/>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700">
  <text x="303" y="526" fill="#4b6d89">否</text>
  <text x="961" y="526" fill="#c96442">是</text>
</g>
<!-- Two outcomes: there is deliberately no merger arrow from the no-financing branch. -->
<g filter="url(#shadow)">
  <rect x="106" y="565" width="482" height="177" rx="18" fill="#ebf2f8" stroke="#cbd9e6" stroke-width="2"/>
  <rect x="690" y="565" width="482" height="177" rx="18" fill="#f9eee8" stroke="#ebc6b5" stroke-width="2"/>
</g>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
  <circle cx="158" cy="617" r="23" fill="#d9e5ef"/>
  <path d="M143 613 H173 V625 H143 Z" fill="#355b78"/>
  <path d="M143 613 V607 H173 V613" fill="#c96442"/>
  <text x="204" y="624" font-size="32" font-weight="700" fill="#172b43">近期无需外部融资</text>
  <text x="143" y="677" font-size="24" fill="#526273">股价波动不直接改变公司现金</text>
  <text x="143" y="711" font-size="24" fill="#526273">对现有经营的即时影响通常较弱</text>
  <circle cx="742" cy="617" r="23" fill="#f2dacd"/>
  <rect x="731" y="600" width="22" height="34" rx="3" fill="#fffefa" stroke="#c96442" stroke-width="2.5"/>
  <path d="M736 609 H748 M736 616 H748 M736 623 H745" stroke="#c96442" stroke-width="2" stroke-linecap="round"/>
  <text x="785" y="624" font-size="31" font-weight="700" fill="#9f4e35">近期需要融资或股权支付</text>
  <text x="727" y="677" font-size="24" fill="#6d5f5d">股权：融资稀释、交易支付能力</text>
  <text x="727" y="711" font-size="24" fill="#6d5f5d">债务：利率、担保和契约条件</text>
</g>
<!-- Only the financing-dependent side proceeds along the valuation transmission path. -->
<path d="M932 758 V803" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrOrange)"/>
<g filter="url(#shadow)"><rect x="690" y="819" width="482" height="72" rx="15" fill="#fffefa" stroke="#e5dfd5" stroke-width="2"/></g>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
  <rect x="719" y="838" width="30" height="33" rx="5" fill="#f4e4da"/>
  <path d="M726 847 H741 M726 854 H741 M726 861 H735" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/>
  <text x="936" y="865" text-anchor="middle" font-size="30" font-weight="700" fill="#172b43">可能改变投资与合作安排</text>
</g>
<path d="M931 906 V928" fill="none" stroke="#c96442" stroke-width="3.7" stroke-linecap="round" marker-end="url(#arrOrange)"/>
<g filter="url(#shadow)"><rect x="690" y="944" width="482" height="64" rx="14" fill="url(#navy)"/></g>
<g font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif">
  <circle cx="732" cy="976" r="13" fill="none" stroke="#e9a17f" stroke-width="3"/>
  <circle cx="732" cy="976" r="5" fill="#e9a17f"/>
  <text x="940" y="987" text-anchor="middle" font-size="30" font-weight="700" fill="#fffefa">实际经营结果 · 修正预期</text>
</g>
<!-- The only feedback loop runs around the perimeter, not through nodes. -->
<path d="M675 976 H54 V233 H124" fill="none" stroke="#4b6d89" stroke-width="3" stroke-dasharray="9 10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrBlue)"/>
<text transform="translate(79 818) rotate(-90)" text-anchor="middle" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#4b6d89">经营结果反馈到下一轮回报预期</text>
</svg>