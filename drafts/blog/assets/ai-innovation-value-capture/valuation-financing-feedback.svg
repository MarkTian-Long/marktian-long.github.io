<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">估值与经营之间的反馈</title><desc id="desc">回报预期影响定价与融资，资金条件可能改变投资与合作，经营结果再修正回报预期。虚线表示有条件的影响，不是必然循环。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#c96442"/></marker></defs><rect width="1280" height="720" rx="24" fill="#faf9f5"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif" fill="#080c18"><text x="64" y="96" font-size="60" font-weight="600" text-anchor="start" fill="#080c18">估值与经营，存在有条件的反馈</text><rect x="64" y="170" width="472" height="174" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><text x="300" y="242" font-size="56" font-weight="600" text-anchor="middle" fill="#080c18">回报预期</text><text x="300" y="303" font-size="38" font-weight="400" text-anchor="middle" fill="#5e5d59">多少 · 多久 · 多大风险</text><rect x="744" y="170" width="472" height="174" rx="18" fill="#f6e9e0" stroke="#e8e6dc" stroke-width="2"/><text x="980" y="242" font-size="56" font-weight="600" text-anchor="middle" fill="#080c18">定价与融资</text><text x="980" y="303" font-size="38" font-weight="400" text-anchor="middle" fill="#5e5d59">价格 · 额度 · 条款</text><rect x="744" y="470" width="472" height="174" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><text x="980" y="542" font-size="56" font-weight="600" text-anchor="middle" fill="#080c18">投资与合作</text><text x="980" y="603" font-size="38" font-weight="400" text-anchor="middle" fill="#5e5d59">取得资源 · 承担义务</text><rect x="64" y="470" width="472" height="174" rx="18" fill="#f0eee6" stroke="#e8e6dc" stroke-width="2"/><text x="300" y="542" font-size="56" font-weight="600" text-anchor="middle" fill="#080c18">经营结果</text><text x="300" y="603" font-size="38" font-weight="400" text-anchor="middle" fill="#5e5d59">实际回报 · 资金余量</text><path d="M555 257H721" fill="none" stroke="#c96442" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow)"/><path d="M980 365V448" fill="none" stroke="#c96442" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow)"/><path d="M725 557H559" fill="none" stroke="#c96442" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow)"/><path d="M300 450V368" fill="none" stroke="#c96442" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#arrow)"/></g></svg>