<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024" role="img" aria-labelledby="title desc">
<title id="title">估值通过融资条件影响经营的条件路径</title>
<desc id="desc">未来回报预期影响市场定价。企业是否需要外部融资或股权支付，决定定价变化是否影响融资条件和投资安排；不依赖融资时，短期直接影响通常较弱。经营结果会反馈并修正下一轮回报预期。</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2efe7"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294660"/><stop offset="1" stop-color="#101d30"/></linearGradient>
 <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9a17f"/><stop offset="1" stop-color="#c96442"/></linearGradient>
 <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#172b43" flood-opacity=".12"/></filter>
 <marker id="arrowNavy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#4f6f8a"/></marker>
 <marker id="arrowClay" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#c96442"/></marker>
</defs>
<rect width="1280" height="1024" rx="22" fill="url(#paper)"/>
<text x="72" y="78" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#101d30">估值影响经营，要经过融资这道条件门</text>
<text x="74" y="120" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" fill="#626b76">股价变化不会直接扣走公司现金；融资依赖决定它是否进一步传导。</text>
<!-- top row -->
<g filter="url(#shadow)">
 <rect x="105" y="165" width="450" height="112" rx="18" fill="#fffefa" stroke="#dce3e8" stroke-width="2"/>
 <rect x="725" y="165" width="450" height="112" rx="18" fill="#fffefa" stroke="#ead8cd" stroke-width="2"/>
</g>
<g>
 <circle cx="165" cy="221" r="30" fill="#e6edf2"/>
 <rect x="147" y="225" width="12" height="18" rx="3" fill="#4f6f8a"/><rect x="165" y="213" width="12" height="30" rx="3" fill="#31516e"/><rect x="183" y="201" width="12" height="42" rx="3" fill="#c96442"/>
 <text x="370" y="215" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#172b43">未来回报预期</text>
 <text x="370" y="248" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#687181">增长 · 盈利 · 竞争格局 · 风险</text>
</g>
<path d="M565 221 H704" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowClay)"/>
<g>
 <circle cx="785" cy="221" r="30" fill="#f7e9e1"/>
 <path d="M768 236 L768 209 L785 195 L802 209 L802 236 Z" fill="#c96442" opacity=".9"/>
 <path d="M776 219 H794 M785 211 V227" stroke="#fffefa" stroke-width="3" stroke-linecap="round"/>
 <text x="985" y="215" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#a95336">市场定价</text>
 <text x="985" y="248" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#687181">股权价格 · 估值预期</text>
</g>
<path d="M950 278 V316" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowClay)"/>
<!-- decision gate -->
<g filter="url(#shadow)">
 <rect x="270" y="325" width="740" height="112" rx="20" fill="url(#navy)" stroke="#d97757" stroke-width="2"/>
</g>
<text x="640" y="372" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#fffefa">企业是否需要外部融资或股权支付？</text>
<text x="640" y="407" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#dce4ec">现金储备、经营回款与扩张计划决定传导强度</text>
<!-- branch lines -->
<path d="M450 437 V478 H320 V515" fill="none" stroke="#4f6f8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowNavy)"/>
<path d="M830 437 V478 H960 V515" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowClay)"/>
<circle cx="320" cy="490" r="20" fill="#4f6f8a"/><text x="320" y="497" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fffefa">否</text>
<circle cx="960" cy="490" r="20" fill="#c96442"/><text x="960" y="497" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fffefa">是</text>
<!-- no branch -->
<g filter="url(#shadow)">
 <rect x="75" y="520" width="490" height="180" rx="18" fill="#edf3f8" stroke="#c8d8e5" stroke-width="2"/>
 <rect x="715" y="520" width="490" height="180" rx="18" fill="#f9eee8" stroke="#e8c7b6" stroke-width="2"/>
</g>
<g>
 <circle cx="145" cy="574" r="28" fill="#d9e6ef"/>
 <rect x="127" y="561" width="36" height="27" rx="5" fill="#31516e"/>
 <path d="M127 570 H163" stroke="#e9a17f" stroke-width="3"/>
 <text x="360" y="570" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#172b43">近期不依赖外部融资</text>
 <text x="320" y="620" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#596270">股价变化不等于现金流变化</text>
 <text x="320" y="654" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#596270">短期经营的直接影响通常较弱</text>
</g>
<g>
 <circle cx="785" cy="574" r="28" fill="#f3dfd4"/>
 <rect x="772" y="554" width="26" height="40" rx="4" fill="#fffefa" stroke="#c96442" stroke-width="2.5"/>
 <path d="M778 566 H792 M778 574 H792 M778 582 H788" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/>
 <text x="1000" y="570" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#a95336">近期需要融资或股权支付</text>
 <text x="960" y="620" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#596270">股权：稀释比例 · 并购支付能力</text>
 <text x="960" y="654" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#596270">债务：利率 · 担保 · 契约条件</text>
</g>
<!-- converge to choices -->
<path d="M320 700 V740 H640 V760" fill="none" stroke="#4f6f8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowNavy)"/>
<path d="M960 700 V740 H640" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g filter="url(#shadow)">
 <rect x="330" y="765" width="620" height="82" rx="16" fill="#fffefa" stroke="#e2ddd3" stroke-width="2"/>
</g>
<text x="640" y="815" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#172b43">投资、采购与合作安排</text>
<path d="M640 847 V878" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowClay)"/>
<g filter="url(#shadow)">
 <rect x="330" y="885" width="620" height="84" rx="16" fill="url(#navy)"/>
</g>
<text x="640" y="920" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#fffefa">实际经营结果</text>
<text x="640" y="950" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#dce4ec">收入 · 成本 · 利用率 · 利润</text>
<!-- feedback loop, outside main reading path -->
<path d="M330 927 H42 V221 H95" fill="none" stroke="#4f6f8a" stroke-width="3.5" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowNavy)"/>
<rect x="72" y="770" width="232" height="48" rx="12" fill="#e7edf2" stroke="#cbd8e2" stroke-width="1.5"/>
<text x="188" y="800" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#31516e">经营结果修正下一轮预期</text>
</svg>