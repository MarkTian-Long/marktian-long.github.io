<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">估值影响经营，要经过融资这道条件门</title>
<desc id="desc">未来回报预期影响市场定价。企业是否依赖外部融资或股权支付，决定定价变化是否进一步影响融资条件与投资安排；实际经营结果再反馈到下一轮回报预期。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f3f0e8"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263f5b"/><stop offset="1" stop-color="#101d30"/></linearGradient>
  <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9a17f"/><stop offset="1" stop-color="#c96442"/></linearGradient>
  <filter id="lift" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#172b43" flood-opacity=".13"/></filter>
  <marker id="arrowClay" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#c96442"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#4f6f8a"/></marker>
</defs>
<rect width="1280" height="720" rx="20" fill="url(#paper)"/>
<path d="M1 20 Q1 1 20 1 H1260 Q1279 1 1279 20 V700 Q1279 719 1260 719 H20 Q1 719 1 700 Z" fill="none" stroke="#e7e2d8" stroke-width="2"/>
<text x="78" y="64" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#101d30">估值影响经营，要经过融资这道条件门</text>
<text x="80" y="103" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" fill="#596270">股价变化本身不会从公司账户扣走现金；融资依赖决定它是否进一步传导。</text>

<!-- Feedback loop: operating outcomes update the next round of expectations. -->
<path d="M390 674 H42 V176 H102" fill="none" stroke="#4f6f8a" stroke-width="3.5" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<text x="29" y="450" transform="rotate(-90 29 450)" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#4f6f8a">经营结果反馈到下一轮回报预期</text>

<!-- Top: expectation and market pricing. -->
<g filter="url(#lift)">
  <rect x="104" y="133" width="456" height="88" rx="16" fill="#fffefa" stroke="#e6e0d5" stroke-width="2"/>
  <rect x="720" y="133" width="456" height="88" rx="16" fill="#fffefa" stroke="#e6e0d5" stroke-width="2"/>
</g>
<g>
  <rect x="132" y="157" width="15" height="39" rx="4" fill="#4f6f8a"/>
  <rect x="155" y="146" width="15" height="50" rx="4" fill="#31516e"/>
  <rect x="178" y="137" width="15" height="59" rx="4" fill="#c96442"/>
  <text x="220" y="169" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#172b43">未来回报预期</text>
  <text x="220" y="198" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#687181">多少 · 多久 · 多大风险</text>
</g>
<path d="M572 177 H704" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowClay)"/>
<g>
  <rect x="750" y="151" width="61" height="48" rx="8" fill="#203b58"/>
  <rect x="758" y="158" width="45" height="32" rx="4" fill="#e9edf1"/>
  <path d="M765 183 L777 172 L785 177 L797 165" fill="none" stroke="#c96442" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="169" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#a95336">市场定价</text>
  <text x="840" y="198" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" fill="#687181">股权价格 · 估值预期</text>
</g>
<path d="M948 223 V250" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowClay)"/>

<!-- Central decision. -->
<g filter="url(#lift)">
  <rect x="262" y="257" width="756" height="92" rx="18" fill="url(#navy)" stroke="#d97757" stroke-width="2"/>
</g>
<g>
  <circle cx="323" cy="303" r="27" fill="#e8a184"/>
  <ellipse cx="323" cy="290" rx="13" ry="5.5" fill="#fff1e8"/>
  <path d="M310 290 V312 C310 319 336 319 336 312 V290" fill="#fff1e8" opacity=".96"/>
  <ellipse cx="323" cy="301" rx="13" ry="5.5" fill="#f5c4ad"/>
  <ellipse cx="323" cy="312" rx="13" ry="5.5" fill="#fff1e8"/>
  <path d="M365 276 V330" stroke="#64788c" stroke-width="2"/>
  <text x="690" y="294" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#fffefa">企业是否依赖外部融资或股权支付？</text>
  <text x="690" y="325" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#dce4ec">现金储备、经营回款和扩张计划会改变答案</text>
</g>

<!-- Conditional branches. -->
<path d="M500 349 V374 H344 V403" fill="none" stroke="#4f6f8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path d="M780 349 V374 H936 V403" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowClay)"/>
<circle cx="344" cy="408" r="20" fill="#4f6f8a"/>
<circle cx="936" cy="408" r="20" fill="#c96442"/>
<text x="344" y="416" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">否</text>
<text x="936" y="416" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#fff">是</text>

<!-- Left branch card. -->
<g filter="url(#lift)">
  <rect x="84" y="433" width="520" height="116" rx="16" fill="#edf3fb" stroke="#c9d8e8" stroke-width="2"/>
  <rect x="676" y="433" width="520" height="116" rx="16" fill="#f8eee8" stroke="#e9c5b4" stroke-width="2"/>
</g>
<g>
  <circle cx="151" cy="491" r="31" fill="#dbe6f0"/>
  <rect x="130" y="477" width="42" height="28" rx="5" fill="#31516e"/>
  <path d="M130 485 H172" stroke="#e9a17f" stroke-width="3"/>
  <circle cx="159" cy="491" r="7" fill="#e9a17f"/>
  <text x="214" y="479" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172b43">近期不依赖外部融资</text>
  <text x="214" y="512" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#596270">股价变化不等于现金流变化</text>
  <text x="214" y="537" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#596270">短期经营的直接影响可能较弱</text>
</g>
<g>
  <circle cx="743" cy="491" r="31" fill="#f3dfd4"/>
  <rect x="727" y="470" width="32" height="42" rx="4" fill="#fffefa" stroke="#c96442" stroke-width="2.5"/>
  <path d="M734 482 H752 M734 490 H752 M734 498 H746" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/>
  <text x="806" y="479" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#a95336">近期需要融资或股权支付</text>
  <text x="806" y="512" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#596270">股权：稀释比例与交易支付能力</text>
  <text x="806" y="537" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#596270">债务：利率、担保与契约条件</text>
</g>

<!-- Branches converge into operating choices. -->
<path d="M344 549 V574 H640 V590" fill="none" stroke="#4f6f8a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M936 549 V574 H640" fill="none" stroke="#c96442" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M640 574 V590" fill="none" stroke="#c96442" stroke-width="4" marker-end="url(#arrowClay)"/>
<g filter="url(#lift)">
  <rect x="382" y="592" width="516" height="55" rx="14" fill="#fffefa" stroke="#e4dfd5" stroke-width="2"/>
</g>
<g>
  <path d="M420 621 L431 610 C437 604 447 604 453 610 L458 615" fill="none" stroke="#4f6f8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M462 620 L451 631 C445 637 435 637 429 631 L424 626" fill="none" stroke="#c96442" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M438 626 L450 614" fill="none" stroke="#c96442" stroke-width="4" stroke-linecap="round"/>
  <text x="675" y="628" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#172b43">投资、采购与合作安排</text>
</g>
<path d="M640 648 V660" fill="none" stroke="#c96442" stroke-width="3.5" marker-end="url(#arrowClay)"/>
<g filter="url(#lift)">
  <rect x="382" y="663" width="516" height="46" rx="12" fill="url(#navy)"/>
</g>
<circle cx="430" cy="686" r="15" fill="none" stroke="#e9a17f" stroke-width="3"/>
<circle cx="430" cy="686" r="6" fill="#e9a17f"/>
<path d="M430 670 V678 M430 694 V702 M414 686 H422 M438 686 H446" stroke="#e9a17f" stroke-width="2.5" stroke-linecap="round"/>
<text x="662" y="694" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#fffefa">实际经营结果 · 修正未来预期</text>
</svg>