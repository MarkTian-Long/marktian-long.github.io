<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
<title>一次完成任务，还是长期接住事务？</title>
<rect x="0" y="0" width="1280" height="720" rx="0" ry="0" fill="#080c18" stroke="none" stroke-width="1"/>
<text x="57" y="57" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#d97757">PERSONAL AGENT / 核心机制</text>
<text x="56" y="126" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="47" font-weight="400" fill="#faf9f5">一次完成任务，还是长期接住事务？</text>
<text x="57" y="172" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#9ba7ba">差别不在能执行多少步，而在后续由谁记挂和跟进</text>
<rect x="48" y="202" width="1184" height="152" rx="25" ry="25" fill="#121a2a" stroke="#394255" stroke-width="2"/>
<text x="75" y="277" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#faf9f5">一次任务</text>
<text x="75" y="316" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#9ba7ba">交付后可结束</text>
<rect x="310" y="220" width="265" height="116" rx="17" ry="17" fill="#1d2739" stroke="none" stroke-width="1"/>
<text x="330" y="273" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#faf9f5">用户交代需求</text>
<text x="330" y="313" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#9ba7ba">限定本次目标</text>
<rect x="604" y="220" width="265" height="116" rx="17" ry="17" fill="#1d2739" stroke="none" stroke-width="1"/>
<text x="624" y="273" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#faf9f5">Agent 交付结果</text>
<text x="624" y="313" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#9ba7ba">完成一段工作</text>
<rect x="898" y="220" width="265" height="116" rx="17" ry="17" fill="#1d2739" stroke="none" stroke-width="1"/>
<text x="918" y="273" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#faf9f5">后续变化由人接回</text>
<text x="918" y="313" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#9ba7ba">重新记挂与追踪</text>
<line x1="575" y1="278" x2="589" y2="278" stroke="#7e8ca3" stroke-width="4" stroke-linecap="round"/><polygon points="589,270 604,278 589,286" fill="#7e8ca3"/>
<line x1="869" y1="278" x2="883" y2="278" stroke="#7e8ca3" stroke-width="4" stroke-linecap="round"/><polygon points="883,270 898,278 883,286" fill="#7e8ca3"/>
<rect x="48" y="382" width="1184" height="162" rx="25" ry="25" fill="#181c2d" stroke="#d97757" stroke-width="3"/>
<rect x="68" y="411" width="205" height="106" rx="16" ry="16" fill="#3b2731" stroke="none" stroke-width="1"/>
<text x="83" y="465" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#ffc3ad">持续委托</text>
<text x="82" y="503" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#efbaaa">对一类事务负责</text>
<rect x="310" y="398" width="265" height="131" rx="17" ry="17" fill="#242c40" stroke="none" stroke-width="1"/>
<text x="329" y="450" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#faf9f5">保留未完事项</text>
<text x="329" y="497" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#c2c9d3">状态、条件、下一步</text>
<rect x="604" y="398" width="265" height="131" rx="17" ry="17" fill="#242c40" stroke="none" stroke-width="1"/>
<text x="623" y="450" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#faf9f5">变化后协调多方</text>
<text x="623" y="497" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#c2c9d3">跨服务、跨联系人</text>
<rect x="898" y="398" width="265" height="131" rx="17" ry="17" fill="#242c40" stroke="none" stroke-width="1"/>
<text x="917" y="450" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#faf9f5">继续跟进到结果</text>
<text x="917" y="497" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#c2c9d3">必要时补救与请示</text>
<line x1="575" y1="463" x2="589" y2="463" stroke="#d97757" stroke-width="4" stroke-linecap="round"/><polygon points="589,455 604,463 589,471" fill="#d97757"/>
<line x1="869" y1="463" x2="883" y2="463" stroke="#d97757" stroke-width="4" stroke-linecap="round"/><polygon points="883,455 898,463 883,471" fill="#d97757"/>
<text x="57" y="605" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#d97757">检验标准</text>
<text x="216" y="605" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="400" fill="#faf9f5">人少记挂、少催办、少协调、少补救了吗？</text>
<line x1="58" y1="630" x2="1222" y2="630" stroke="#3a4456" stroke-width="2"/>
<text x="58" y="672" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#9ba7ba">本文归纳的产品目标，并非声称某一款产品已完整实现。</text>
</svg>