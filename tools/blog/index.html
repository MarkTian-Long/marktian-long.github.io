            --text-2:    #5e5d59;
            --text-3:    #87867f;

            --clay:      #c96442;

        [data-theme="dark"] {

            --text-2:    #8a95b5;
            --text-3:    #4a5270;
            --border:    rgba(255,255,255,0.08);

            --clay:      #d97757;
            --clay-soft: rgba(217, 119, 87, 0.12);

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            color: var(--text-1);
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            font-size: 15px;

        .blog-layout {

            margin: 0 auto;

        .blog-sidebar {

            top: 0;

            overflow-y: auto;
            padding: 48px 0;
            display: flex;
            flex-direction: column;
            gap: 32px;
            border-right: 1px solid var(--border);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-3);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--clay); }
        .blog-site-nav {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: var(--site-nav-space);
        }
        .blog-site-nav a {
            display: inline-flex;
            align-items: center;
            min-height: var(--site-nav-target);
            color: var(--text-2);
            font-size: var(--site-nav-font-size);
            text-decoration: none;
        }
        .blog-site-nav a:hover {
            color: var(--text-1);
            text-decoration: underline;
            text-underline-offset: var(--site-nav-focus-offset);
        }
        .blog-site-nav a:focus-visible {
            outline: var(--site-nav-focus-width) solid var(--accent);
            outline-offset: var(--site-nav-focus-offset);
        }
        .blog-site-nav-mobile { display: none; }
        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-1);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--clay); }
        .search-box input::placeholder { color: var(--text-3); }
        .time-filter {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .time-filter-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
        }
        .time-dropdown {
            position: relative;
            width: 100%;
            min-width: 0;
        }
        .time-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            min-height: 38px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-2);
            font: inherit;
            font-size: 13px;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .time-trigger:hover,
        .time-dropdown.open .time-trigger {
            border-color: var(--clay);
            color: var(--text-1);
            background: var(--bg-card);
        }
        .time-trigger:focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
        }
        .time-trigger-text {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .time-trigger-icon {
            width: 7px;
            height: 7px;
            flex: 0 0 auto;
            border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg) translateY(-2px);
            transition: transform 0.15s ease;
        }
        .time-dropdown.open .time-trigger-icon {
            transform: rotate(225deg) translate(-1px, -1px);
        }
        .time-panel {
            position: absolute;
            top: calc(100% + 7px);
            left: 0;
            z-index: 50;
            width: 100%;
            padding: 7px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-card);
            box-shadow: 0 12px 28px rgba(20, 20, 19, 0.12);
        }
        .time-panel[hidden] { display: none; }
        .time-panel-inner {
            max-height: min(320px, 55vh);
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .time-group + .time-group {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid var(--border);
        }
        .time-group-title {
            padding: 5px 8px 4px;
            color: var(--text-3);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
        }
        .time-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            min-height: 34px;
            padding: 6px 8px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--text-2);
            font: inherit;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .time-option:hover {
            background: var(--bg-hover);
            color: var(--text-1);
        }
        .time-option.active {
            background: var(--clay-soft);
            color: var(--clay);
            font-weight: 600;
        }
        .time-option:focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: -2px;
        }
        .time-option-title { min-width: 0; }
        .time-option-count {
            flex: 0 0 auto;
            margin-left: auto;
            color: var(--text-3);
            font-size: 11px;
            font-weight: 400;
            white-space: nowrap;
        }
        .time-option-check {
            flex: 0 0 auto;
            width: 12px;
            color: var(--clay);
            font-size: 11px;
            text-align: right;
            opacity: 0;
        }
        .time-option.active .time-option-check { opacity: 1; }
        .cat-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .cat-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            background: transparent;
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            font-size: 14px;
            color: var(--text-2);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-align: left;
        }
        .cat-btn:hover { background: var(--bg-hover); color: var(--text-1); }
        .cat-btn.active { color: var(--clay); font-weight: 600; background: var(--clay-soft); }
        .cat-btn:focus-visible,
        .cat-tab:focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
        }
        .cat-count {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-3);
            min-width: 2ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .cat-btn.active .cat-count { color: var(--clay); opacity: 0.7; }
        .blog-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 40px;
        }
        .theme-toggle {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            color: var(--text-3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.2s, border-color 0.2s;
        }
        .theme-toggle:hover { color: var(--clay); border-color: var(--clay); }

        /* ── 右侧主区 ── */
        .blog-main { padding: 48px 0 80px; }
        .blog-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--clay);
        }
        .blog-title {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-1);
            margin: 8px 0 10px;
            line-height: 1.25;
        }
        .blog-desc { font-size: 14px; color: var(--text-2); }

        /* ── 文章列表 ── */
        .year-group { margin-bottom: 36px; }
        .year-label {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-style: italic;
            font-size: 13px;
            color: var(--text-3);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .post-row {
            display: block;
            padding: 14px 12px;
            margin: 0 -12px;
            border-radius: 8px;
            color: inherit;
            transition: background 0.15s;
        }
        .post-row:hover { background: var(--bg-hover); }
        .post-meta {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-bottom: 5px;
            font-size: 12px;
            line-height: 1.5;
        }
        .post-date {
            font-size: 12px;
            color: var(--text-2);
            white-space: nowrap;
        }
        .post-category {
            border: 0;
            background: transparent;
            padding: 0;
            color: var(--clay);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .post-category:hover { text-decoration: underline; text-underline-offset: 3px; }
        .post-category:focus-visible,
        .post-title:focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 3px;
            border-radius: 2px;
        }
        .post-featured {
            color: var(--text-2);
            font-size: 12px;
        }
        .post-title {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-1);
            margin-bottom: 4px;
            line-height: 1.45;
            text-decoration: none;
            transition: color 0.15s;
        }
        .post-heading { margin: 0; font-size: inherit; line-height: 1.45; font-weight: inherit; }
        .post-row:hover .post-title { color: var(--clay); }
        .post-summary {
            font-size: 13px;
            color: var(--text-2);
            line-height: 1.55;
            margin-bottom: 8px;
        }
        .post-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .post-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            background: var(--clay-soft);
            color: var(--clay);
        }
        .featured-section { margin-bottom: 36px; }
        .featured-label {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-style: italic;
            font-size: 13px;
            color: var(--text-3);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .empty { color: var(--text-3); font-size: 14px; padding: 20px 0; }
        .loading { color: var(--text-3); font-size: 14px; padding: 20px 0; }
        .filter-status {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin: -12px 0 22px;
            font-size: 12px;
            color: var(--text-3);
        }
        .filter-status[hidden] { display: none; }
        .filter-status button {
            border: 0;
            background: transparent;
            color: var(--clay);
            font: inherit;
            cursor: pointer;
            padding: 4px 0;
        }
        .filter-status button:hover { text-decoration: underline; }
        .filter-status button:focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
        }
        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--clay-soft);
            color: var(--clay);
            line-height: 1;
        }
        .chip-clear {
            background: none;
            border: none;
            color: var(--clay);
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            line-height: 1;
            opacity: 0.7;
            font-family: inherit;
        }
        .chip-clear:hover { opacity: 1; }

        /* ── 分页 ── */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .page-btn {
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            font-size: 13px;
            color: var(--text-2);
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .page-btn:hover { background: var(--bg-hover); color: var(--text-1); }
        .page-btn.active { background: var(--clay-soft); color: var(--clay); border-color: transparent; font-weight: 600; }
        .page-btn:disabled { opacity: 0.35; cursor: default; }
        .page-ellipsis { font-size: 13px; color: var(--text-3); padding: 0 4px; }

        /* ── 移动端控件（桌面隐藏）── */
        .mobile-controls { display: none; }

        /* ── 响应式 ── */
        @media (max-width: 680px) {
            .blog-layout { grid-template-columns: 1fr; padding: 0 16px; gap: 0; }
            .blog-sidebar { display: none; }
            .blog-main { min-width: 0; padding: 32px 0 60px; }
            .blog-site-nav-mobile {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
                margin-bottom: var(--site-nav-separation);
            }
            .mobile-controls {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 28px;
            }
            .mobile-controls input {
                width: 100%;
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 7px 10px;
                font-size: 13px;
                font-family: inherit;
                color: var(--text-1);
                outline: none;
            }
            .mobile-controls input::placeholder { color: var(--text-3); }
            .time-filter-mobile { flex-direction: row; align-items: center; gap: 12px; }
            .time-filter-mobile .time-filter-label { flex-shrink: 0; }
            .time-filter-mobile .time-dropdown { flex: 1; min-width: 0; }
            .time-filter-mobile .time-trigger { min-height: 44px; }
            .time-filter-mobile .time-panel { right: 0; left: auto; }
            .cat-tabs { display: flex; overflow-x: auto; gap: 8px; scrollbar-width: none; }
            .cat-tabs::-webkit-scrollbar { display: none; }
            .cat-tab {
                flex-shrink: 0;
                min-height: 44px;
                padding: 7px 14px;
                border-radius: 20px;
                border: 1px solid var(--border);
                background: transparent;
                font-family: 'Source Sans 3', -apple-system, sans-serif;
                color: var(--text-2);
                font-size: 13px;
                cursor: pointer;
                transition: background 0.15s, color 0.15s;
                white-space: nowrap;
            }
            .cat-tab.active { background: var(--clay-soft); color: var(--clay); border-color: transparent; }
        }
    </style>
</head>

        <!-- 移动端控件 -->
        <div class="mobile-controls">
            <input id="searchInputMobile" placeholder="搜索文章…" type="text" autocomplete="off" />
            <div class="cat-tabs" role="group" aria-label="文章分类">
                <button class="cat-tab active" data-cat="all" aria-pressed="true">全部</button>
                <button class="cat-tab" data-cat="技术" aria-pressed="false">技术</button>
                <button class="cat-tab" data-cat="产品" aria-pressed="false">产品</button>
                <button class="cat-tab" data-cat="商业" aria-pressed="false">商业</button>
                <button class="cat-tab" data-cat="行业" aria-pressed="false">行业</button>
                <button class="cat-tab" data-cat="实践" aria-pressed="false">实践</button>
            </div>
            <div class="time-filter time-filter-mobile">
                <div class="time-filter-label" id="timeLabelMobile">发布时间</div>
                <div class="time-dropdown" data-time-dropdown="mobile">
                    <button class="time-trigger" type="button" data-time-trigger aria-expanded="false" aria-controls="timePanelMobile" aria-labelledby="timeLabelMobile timeValueMobile">
                        <span class="time-trigger-text" id="timeValueMobile">全部时间</span>
                        <span class="time-trigger-icon" aria-hidden="true"></span>
                    </button>
                    <div class="time-panel" id="timePanelMobile" data-time-panel hidden></div>
                </div>
            </div>
        </div>

        <div id="filterStatus" class="filter-status" role="status" aria-live="polite" hidden></div>
        <div id="featuredRoot"></div>
        <div id="archiveRoot"><div class="loading">加载中…</div></div>
    </main>

</div>

<script>
(function () {
    let posts = [], featuredPosts = [], cat = 'all', query = '', timeFilter = 'all', publishMonths = [], timer, page = 1;
    const PAGE_SIZE = 10;

    // ── 主题初始化 ──
    const savedTheme = localStorage.getItem('blog_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const initTheme = savedTheme !== null ? savedTheme : (prefersDark ? 'dark' : '');
    document.body.dataset.theme = initTheme;
    updateThemeIcon(initTheme);

    function updateThemeIcon(theme) {
        document.getElementById('iconSun').style.display = theme === 'dark' ? 'block' : 'none';
        document.getElementById('iconMoon').style.display = theme === 'dark' ? 'none' : 'block';
    }

    document.getElementById('themeToggle').addEventListener('click', function () {
        const next = document.body.dataset.theme === 'dark' ? '' : 'dark';
        document.body.dataset.theme = next;
        localStorage.setItem('blog_theme', next);
        updateThemeIcon(next);
    });

    // ── 数据加载 ──
    async function load() {
        try {
            const data = await fetch('data/posts-meta.json', { cache: 'no-store' }).then(r => r.json());
            // Sort before pagination; otherwise newly appended posts may be hidden on the last page.
            posts = data.posts.slice().sort(function (a, b) {
                return b.date.localeCompare(a.date);
            });
            publishMonths = Array.from(new Set(posts.map(function (post) { return post.date; }).filter(function (date) {
                return /^\d{4}\.(0[1-9]|1[0-2])$/.test(date);
            }))).sort().reverse();
            populateTimeOptions();
            readUrlFilters();
            featuredPosts = await loadFeaturedPosts();
            updateCounts();
            render();
        } catch (e) {
            document.getElementById('archiveRoot').innerHTML =
                '<p class="empty">加载失败，请用 HTTP server 打开（file:// 协议不支持 fetch）。</p>';
        }
    }

    async function loadFeaturedPosts() {
        try {
            const data = await fetch('data/featured-posts.json', { cache: 'no-store' }).then(r => r.json());
            if (!data || data.version !== 1 || !Array.isArray(data.featured)) return [];
            const postBySlug = new Map(posts.map(function (post) { return [post.slug, post]; }));
            const seen = new Set();
            return data.featured.reduce(function (validPosts, slug) {
                if (typeof slug !== 'string' || !slug.trim() || seen.has(slug) || !postBySlug.has(slug)) return validPosts;
                seen.add(slug);
                validPosts.push(postBySlug.get(slug));
                return validPosts;
            }, []).slice(0, 5);
        } catch (e) {
            return [];
        }
    }

    // ── 发布时间筛选 ──
    function renderTimeOption(value, label, count) {
        return '<button class="time-option" type="button" data-time-value="' + value + '" aria-pressed="' + String(value === timeFilter) + '">' +
            '<span class="time-option-title">' + label + '</span>' +
            (count === null ? '' : '<span class="time-option-count">' + count + ' 篇</span>') +
            '<span class="time-option-check" aria-hidden="true">✓</span>' +
            '</button>';
    }

    function populateTimeOptions() {
        var counts = {};
        posts.forEach(function (post) { counts[post.date] = (counts[post.date] || 0) + 1; });
        var quickOptions = [
            { value: 'all', label: '全部时间' },
            { value: '3m', label: '最近 3 个自然月' },
            { value: '6m', label: '最近 6 个自然月' }
        ];
        var quickHtml = quickOptions.map(function (option) {
            return renderTimeOption(option.value, option.label, null);
        }).join('');
        var monthHtml = publishMonths.map(function (month) {
            var label = month.slice(0, 4) + ' 年 ' + Number(month.slice(5)) + ' 月';
            return renderTimeOption(month, label, counts[month] || 0);
        }).join('');
        document.querySelectorAll('[data-time-panel]').forEach(function (panel) {
            panel.innerHTML =
                '<div class="time-panel-inner">' +
                    '<section class="time-group" aria-label="快捷筛选">' +
                        '<div class="time-group-title">快捷筛选</div>' + quickHtml +
                    '</section>' +
                    '<section class="time-group" aria-label="按月份浏览">' +
                        '<div class="time-group-title">按月份浏览</div>' + monthHtml +
                    '</section>' +
                '</div>';
        });
        syncTimeControls();
    }

    function syncTimeControls() {
        document.querySelectorAll('[data-time-dropdown]').forEach(function (dropdown) {
            var text = dropdown.querySelector('.time-trigger-text');
            if (text) text.textContent = timeLabel();
            dropdown.querySelectorAll('[data-time-value]').forEach(function (option) {
                var active = option.dataset.timeValue === timeFilter;
                option.classList.toggle('active', active);
                option.setAttribute('aria-pressed', String(active));
            });
        });
    }

    function toggleTimeDropdown(dropdown, open) {
        if (!dropdown) return;
        var shouldOpen = open === undefined ? !dropdown.classList.contains('open') : open;
        var panel = dropdown.querySelector('[data-time-panel]');
        var trigger = dropdown.querySelector('[data-time-trigger]');
        dropdown.classList.toggle('open', shouldOpen);
        if (panel) panel.hidden = !shouldOpen;
        if (trigger) trigger.setAttribute('aria-expanded', String(shouldOpen));
    }

    function closeAllTimeDropdowns() {
        document.querySelectorAll('[data-time-dropdown].open').forEach(function (dropdown) {
            toggleTimeDropdown(dropdown, false);
        });
    }

    function formatMonth(date) {
        return date.getFullYear() + '.' + String(date.getMonth() + 1).padStart(2, '0');
    }

    function timeLabel() {
        if (timeFilter === '3m') return '最近 3 个自然月';
        if (timeFilter === '6m') return '最近 6 个自然月';
        return timeFilter.slice(0, 4) + ' 年 ' + Number(timeFilter.slice(5)) + ' 月';
    }

    function setTimeFilter(value, options) {
        timeFilter = value === 'all' || value === '3m' || value === '6m' || publishMonths.includes(value) ? value : 'all';
        page = 1;
        syncTimeControls();
        if (!options || options.updateUrl !== false) updateFilterUrl('pushState');
        render();
    }

    function updateFilterStatus(total) {
        var element = document.getElementById('filterStatus');
        if (!element) return;
        var active = cat !== 'all' || timeFilter !== 'all' || Boolean(query.trim());
        element.hidden = !active;
        element.replaceChildren();
        if (!active) return;
        var count = document.createElement('span');
        count.textContent = '找到 ' + total + ' 篇文章';
        element.appendChild(count);
        if (timeFilter !== 'all') {
            var clear = document.createElement('button');
            clear.type = 'button';
            clear.textContent = '清除时间';
            clear.setAttribute('aria-label', '清除发布时间筛选');
            clear.addEventListener('click', function () { setTimeFilter('all'); });
            element.appendChild(clear);
        }
    }

    // ── 分类计数 ──
    function updateCounts() {
        const map = { all: posts.length, '技术': 0, '产品': 0, '商业': 0, '行业': 0, '实践': 0 };
        posts.forEach(function (p) { if (p.category in map) map[p.category]++; });
        document.getElementById('cnt-all').textContent = map.all;
        document.getElementById('cnt-tech').textContent = map['技术'];
        document.getElementById('cnt-product').textContent = map['产品'];
        document.getElementById('cnt-biz').textContent = map['商业'];
        document.getElementById('cnt-industry').textContent = map['行业'];
        document.getElementById('cnt-practice').textContent = map['实践'];
    }

    // ── 过滤 ──
    function filtered() {
        var r = cat !== 'all' ? posts.filter(function (p) { return p.category === cat; }) : posts.slice();
        if (query.trim()) {
            var q = query.trim().toLowerCase();
            r = r.filter(function (p) {
                return p.title.toLowerCase().includes(q) ||
                    p.summary.toLowerCase().includes(q) ||
                    p.tags.some(function (t) { return t.toLowerCase().includes(q); }) ||
                    (p.topics || []).some(function (t) { return t.toLowerCase().includes(q); });
            });
        }
        if (timeFilter !== 'all') {
            if (timeFilter === '3m' || timeFilter === '6m') {
                var now = new Date();
                var count = timeFilter === '3m' ? 3 : 6;
                var oldest = formatMonth(new Date(now.getFullYear(), now.getMonth() - count + 1, 1));
                var latest = formatMonth(now);
                r = r.filter(function (p) { return p.date >= oldest && p.date <= latest; });
            } else {
                r = r.filter(function (p) { return p.date === timeFilter; });
            }
        }
        return r;
    }

    // ── 渲染 ──
    function render() {
        var root = document.getElementById('archiveRoot');
        var featuredRoot = document.getElementById('featuredRoot');
        var searchActive = Boolean(query.trim());
        var selectedFeatured = (searchActive || timeFilter !== 'all') ? [] : featuredPosts.filter(function (post) {
            return cat === 'all' || post.category === cat;
        });
        var featuredSlugSet = new Set(featuredPosts.map(function (post) { return post.slug; }));
        var selectedFeaturedSlugs = new Set(selectedFeatured.map(function (post) { return post.slug; }));
        var showFeatured = page === 1 && selectedFeatured.length > 0;
        var list = filtered();
        updateFilterStatus(list.length);
        if (!searchActive && timeFilter === 'all' && selectedFeaturedSlugs.size) {
            list = list.filter(function (post) { return !selectedFeaturedSlugs.has(post.slug); });
        }
        updateFilterChips();

        featuredRoot.innerHTML = showFeatured
            ? '<section class="featured-section" aria-label="精选阅读">' +
                '<div class="featured-label">精选阅读</div>' + renderPostRows(selectedFeatured, true, featuredSlugSet) +
              '</section>'
            : '';
        if (!list.length) {
            root.innerHTML = '<p class="empty">没有符合条件的文章。</p>';
            syncCategoryControls();
            return;
        }

        var totalPages = Math.ceil(list.length / PAGE_SIZE);
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;

        var pageList = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

        // 按 YYYY.MM 分组（保留月份粒度）
        var byYM = {};
        pageList.forEach(function (p) {
            var ym = p.date;
            if (!byYM[ym]) byYM[ym] = [];
            byYM[ym].push(p);
        });
        var groupsHtml = Object.keys(byYM).sort().reverse().map(function (ym) {
            var label = ym.replace('.', ' · ');
            return '<div class="year-group">' +
                '<div class="year-label">' + label + '</div>' +
                renderPostRows(byYM[ym], false, featuredSlugSet) +
                '</div>';
        }).join('');

        var paginationHtml = '';
        if (totalPages > 1) {
            var btns = [];
            btns.push('<button class="page-btn" ' + (page === 1 ? 'disabled' : '') + ' data-goto="' + (page - 1) + '">←</button>');
            for (var i = 1; i <= totalPages; i++) {
                if (totalPages <= 7 || i === 1 || i === totalPages || Math.abs(i - page) <= 1) {
                    btns.push('<button class="page-btn' + (i === page ? ' active' : '') + '" data-goto="' + i + '">' + i + '</button>');
                } else if (Math.abs(i - page) === 2) {
                    btns.push('<span class="page-ellipsis">…</span>');
                }
            }
            btns.push('<button class="page-btn" ' + (page === totalPages ? 'disabled' : '') + ' data-goto="' + (page + 1) + '">→</button>');
            paginationHtml = '<div class="pagination">' + btns.join('') + '</div>';
        }

        root.innerHTML = groupsHtml + paginationHtml;
        syncCategoryControls();

        root.querySelectorAll('.page-btn[data-goto]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var g = parseInt(btn.dataset.goto);
                if (!isNaN(g) && g >= 1 && g <= totalPages && !btn.disabled) {
                    page = g;
                    render();
                    document.getElementById('archiveRoot').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    }

    function renderPostRows(postList, isFeatured, featuredSlugSet) {
        return postList.map(function (p) {
            var tags = (p.tags || []).concat(p.topics || []);
            return '<article class="post-row">' +
                '<div class="post-content">' +
                '<div class="post-meta">' +
                (isFeatured ? '<span class="post-date">' + p.date + '</span>' : '') +
                '<button class="post-category" type="button" data-cat="' + p.category + '" aria-label="筛选' + p.category + '分类">' + p.category + '</button>' +
                (!isFeatured && featuredSlugSet.has(p.slug) ? '<span class="post-featured">精选</span>' : '') +
                '</div>' +
                '<h2 class="post-heading"><a class="post-title" href="' + p.url + '" target="_blank" rel="noopener">' + p.title + '</a></h2>' +
                '<div class="post-summary">' + p.summary + '</div>' +
                (tags.length ? '<div class="post-tags">' + tags.map(function (tag) {
                    return '<span class="post-tag">' + tag + '</span>';
                }).join('') + '</div>' : '') +
                '</div>' +
                '</article>';
        }).join('');
    }

    // ── 过滤状态 chip ──
    function updateFilterChips() {
        var box = document.getElementById('activeFilters');
        if (!box) return;
        var chips = [];
        if (cat !== 'all') {
            chips.push('<span class="filter-chip">' + cat + ' <button class="chip-clear" data-clear="cat" aria-label="清除分类">×</button></span>');
        }
        if (query.trim()) {
            chips.push('<span class="filter-chip">"' + query + '" <button class="chip-clear" data-clear="query" aria-label="清除搜索">×</button></span>');
        }
        if (timeFilter !== 'all') {
            chips.push('<span class="filter-chip">' + timeLabel() + ' <button class="chip-clear" data-clear="time" aria-label="清除时间">×</button></span>');
        }
        box.innerHTML = chips.join('');
        box.style.display = chips.length ? 'flex' : 'none';
        box.querySelectorAll('.chip-clear').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (btn.dataset.clear === 'cat') {
                    setCategory('all');
                } else if (btn.dataset.clear === 'query') {
                    onSearch('');
                } else if (btn.dataset.clear === 'time') {
                    setTimeFilter('all');
                }
            });
        });
    }

    // ── 分类切换 ──
    function syncCategoryControls() {
        document.querySelectorAll('[data-cat]').forEach(function (el) {
            var active = el.dataset.cat === cat;
            el.classList.toggle('active', active);
            el.setAttribute('aria-pressed', String(active));
        });
    }

    function updateFilterUrl(method) {
        var url = new URL(window.location.href);
        if (cat === 'all') url.searchParams.delete('category');
        else url.searchParams.set('category', cat);
        url.searchParams.delete('month');
        url.searchParams.delete('range');
        if (timeFilter === '3m' || timeFilter === '6m') url.searchParams.set('range', timeFilter);
        else if (timeFilter !== 'all') url.searchParams.set('month', timeFilter);
        var nextUrl = url.pathname + url.search + url.hash;
        var currentUrl = window.location.pathname + window.location.search + window.location.hash;
        if (nextUrl !== currentUrl) window.history[method]({}, '', nextUrl);
    }

    function readUrlFilters() {
        var params = new URLSearchParams(window.location.search);
        var requestedCategory = params.get('category');
        var requestedMonth = params.get('month');
        var requestedRange = params.get('range');
        cat = requestedCategory && posts.some(function (post) { return post.category === requestedCategory; })
            ? requestedCategory : 'all';
        timeFilter = requestedMonth && publishMonths.includes(requestedMonth) ? requestedMonth
            : requestedRange === '3m' || requestedRange === '6m' ? requestedRange : 'all';
        page = 1;
        syncCategoryControls();
        syncTimeControls();
        if ((params.has('category') && cat === 'all') ||
            (params.has('month') && requestedMonth !== timeFilter) ||
            (params.has('range') && requestedRange !== timeFilter) ||
            (params.has('month') && params.has('range'))) {
            updateFilterUrl('replaceState');
        }
    }

    function setCategory(c, options) {
        cat = c === 'all' || posts.some(function (post) { return post.category === c; }) ? c : 'all';
        page = 1;
        syncCategoryControls();
        if (!options || options.updateUrl !== false) updateFilterUrl('pushState');
        render();
    }

    // ── 搜索防抖 ──
    function onSearch(val) {
        query = val;
        page = 1;
        var desktop = document.getElementById('searchInput');
        var mobile = document.getElementById('searchInputMobile');
        if (desktop && desktop.value !== val) desktop.value = val;
        if (mobile && mobile.value !== val) mobile.value = val;
        clearTimeout(timer);
        timer = setTimeout(render, 200);
    }

    // ── 事件绑定 ──
    document.addEventListener('click', function (event) {
        var control = event.target.closest('[data-cat]');
        if (control) setCategory(control.dataset.cat);
    });
    window.addEventListener('popstate', function () {
        readUrlFilters();
        render();
    });
    ['searchInput', 'searchInputMobile'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', function (e) { onSearch(e.target.value); });
    });

    document.querySelectorAll('[data-time-trigger]').forEach(function (trigger) {
        trigger.addEventListener('click', function () {
            var dropdown = trigger.closest('[data-time-dropdown]');
            var shouldOpen = !dropdown.classList.contains('open');
            closeAllTimeDropdowns();
            toggleTimeDropdown(dropdown, shouldOpen);
        });
    });

    document.addEventListener('click', function (event) {
        var option = event.target.closest('[data-time-value]');
        if (option) {
            var dropdown = option.closest('[data-time-dropdown]');
            setTimeFilter(option.dataset.timeValue);
            closeAllTimeDropdowns();
            var trigger = dropdown && dropdown.querySelector('[data-time-trigger]');
            if (trigger) trigger.focus();
            return;
        }
        if (!event.target.closest('[data-time-dropdown]')) closeAllTimeDropdowns();
    });

    document.addEventListener('focusin', function (event) {
        if (!event.target.closest('[data-time-dropdown]')) closeAllTimeDropdowns();
    });

    document.addEventListener('keydown', function (event) {
        var dropdown = event.target.closest('[data-time-dropdown]');
        if (!dropdown) return;
        if (event.key === 'Escape' && dropdown.classList.contains('open')) {
            toggleTimeDropdown(dropdown, false);
            dropdown.querySelector('[data-time-trigger]').focus();
            event.preventDefault();
            return;
        }
        var options = Array.from(dropdown.querySelectorAll('[data-time-value]'));
        if (!options.length) return;
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'Home' || event.key === 'End') {
            if (!dropdown.classList.contains('open')) toggleTimeDropdown(dropdown, true);
            var index = options.indexOf(document.activeElement);
            if (event.key === 'Home') index = 0;
            else if (event.key === 'End') index = options.length - 1;
            else if (index < 0) index = Math.max(0, options.findIndex(function (option) { return option.dataset.timeValue === timeFilter; }));
            else index = (index + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
            options[index].focus();
            event.preventDefault();
        }
    });

    load();
})();
</script>
<script src="/assets/js/analytics.js" defer></script>
</body>
